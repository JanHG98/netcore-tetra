[Service]
# TUNSETIFF, interface configuration, routes, forwarding and managed firewall/NAT
# require CAP_NET_ADMIN. CAP_NET_RAW is needed by some iproute/nft/iptables paths.
# Multiple CapabilityBoundingSet= lines are combined by systemd, so this adds the
# packet-data capabilities without intentionally removing capabilities from the
# base station unit.
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW

# Make the host TUN character device visible even when the base unit is hardened.
PrivateDevices=no
DeviceAllow=/dev/net/tun rw

# The managed gateway updates IPv4 forwarding and per-interface rp_filter.
ProtectKernelTunables=no
RuntimeDirectory=netcore-tetra
RuntimeDirectoryMode=0750
ExecStopPost=-/usr/local/libexec/netcore-tetra-packet-gateway-cleanup
