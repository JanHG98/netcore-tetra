# NETCORE-KOMMENTAR – Was: Beschreibt Installation oder Betrieb von 20 Datenpaket data Gateway.
# NETCORE-KOMMENTAR – Warum: Die Trennung in eine eigene Datei macht Zuständigkeit, Wartung und Fehlersuche übersichtlicher.

# Was: Beginnt den Abschnitt `Service`.
# Warum: Zusammengehörige Start-, Laufzeit- oder Installationswerte bleiben dadurch geordnet.
[Service]
# TUNSETIFF, interface configuration, routes, forwarding and managed firewall/NAT
# require CAP_NET_ADMIN. CAP_NET_RAW is needed by some iproute/nft/iptables paths.
# Multiple CapabilityBoundingSet= lines are combined by systemd, so this adds the
# packet-data capabilities without intentionally removing capabilities from the
# base station unit.
# Was: Setzt `AmbientCapabilities` im Abschnitt `Service`.
# Warum: Der Wert wird ausdrücklich festgelegt, damit der Dienst auf jedem System gleich und nachvollziehbar arbeitet.
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
# Was: Setzt `CapabilityBoundingSet` im Abschnitt `Service`.
# Warum: Der Wert wird ausdrücklich festgelegt, damit der Dienst auf jedem System gleich und nachvollziehbar arbeitet.
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW

# Make the host TUN character device visible even when the base unit is hardened.
# Was: Setzt `PrivateDevices` im Abschnitt `Service`.
# Warum: Der Wert wird ausdrücklich festgelegt, damit der Dienst auf jedem System gleich und nachvollziehbar arbeitet.
PrivateDevices=no
# Was: Setzt `DeviceAllow` im Abschnitt `Service`.
# Warum: Der Wert wird ausdrücklich festgelegt, damit der Dienst auf jedem System gleich und nachvollziehbar arbeitet.
DeviceAllow=/dev/net/tun rw

# The managed gateway updates IPv4 forwarding and per-interface rp_filter.
# Was: Setzt `ProtectKernelTunables` im Abschnitt `Service`.
# Warum: Der Wert wird ausdrücklich festgelegt, damit der Dienst auf jedem System gleich und nachvollziehbar arbeitet.
ProtectKernelTunables=no
# Was: Setzt `RuntimeDirectory` im Abschnitt `Service`.
# Warum: Der Wert wird ausdrücklich festgelegt, damit der Dienst auf jedem System gleich und nachvollziehbar arbeitet.
RuntimeDirectory=netcore-tetra
# Was: Setzt `RuntimeDirectoryMode` im Abschnitt `Service`.
# Warum: Der Wert wird ausdrücklich festgelegt, damit der Dienst auf jedem System gleich und nachvollziehbar arbeitet.
RuntimeDirectoryMode=0750
# Was: Führt nach dem Ende eine zusätzliche Aufräumaktion aus.
# Warum: Auch nach einem Absturz bleiben dadurch keine störenden Netzwerk- oder Laufzeitreste zurück.
ExecStopPost=-/usr/local/libexec/netcore-tetra-packet-gateway-cleanup
