# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
comparator = ">="
# Was: Setzt die Einstellung `threshold` für alert rules.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
threshold = 3.0
# Was: Setzt die Einstellung `for_secs` für alert rules.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
for_secs = 0
# Was: Setzt die Einstellung `severity` für alert rules.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
severity = "warning"
# Was: Setzt die Einstellung `enabled` für alert rules.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
enabled = true
# Was: Setzt die Einstellung `labels` für alert rules.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
labels = { source = "netcore-observability" }
# Was: Setzt die Einstellung `annotations` für alert rules.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
annotations = { runbook = "Check the target /metrics endpoint and NMS routing" }

[[targets]]
target_id = "iot-gateway"
display_name = "IoT Gateway / MQTT"
service = "iot-gateway"
base_url = "http://10.0.20.27:8240"
metrics_path = "/metrics"
live_path = "/health/live"
ready_path = "/health/ready"
enabled = true
labels = { environment = "open-lab", component = "iot-gateway" }


