# NetCore IoT Gateway – Phase 5 / OPEN LAB
# Keine Anmeldung, keine Tokens, kein TLS. Nur im isolierten Testnetz verwenden.
# Home Assistant MQTT Discovery ist aktiv. Reale HA-/Homematic-Schreibzugriffe sind standardmäßig aus.

[server]
bind = "0.0.0.0:8240"
history_limit = 1000
max_body_bytes = 1048576

[security]
mode = "open_lab"
allow_remote_management = true

[mqtt]
host = "127.0.0.1"
port = 1883
client_id = "netcore-iot-gateway"
topic_prefix = "netcore/v1"
keep_alive_secs = 30
clean_session = false
reconnect_secs = 3
publish_timeout_secs = 8
qos = 1
event_retain = false
state_retain = true
observe_commands = true
# Veralteter Kompatibilitätsschalter. Muss false bleiben; [commands].enabled ist maßgeblich.
execute_commands = false

[home_assistant]
enabled = true
discovery_enabled = true
discovery_prefix = "homeassistant"
status_topic = "homeassistant/status"
node_id = "netcore_tetra"
discovery_qos = 1
discovery_retain = true
expose_gateway = true
expose_sources = true
expose_virtual_devices = true
# Ausgewählte HA-/Homematic-IP-Entitäten können über diesen Eingang nach NetCore gespiegelt werden.
accept_state_ingress = true
# Leer = netcore/v1/integrations/homeassistant/state
state_ingress_topic = ""
# Reale Aktionen in Home Assistant bleiben aus, bis Automation + Policy bewusst aktiviert wurden.
allow_command_egress = false
# Leer = netcore/v1/integrations/homeassistant/command-egress
command_egress_topic = ""

[homematic]
# Für Homematic IP Access Point normalerweise false lassen und Home Assistant als Bridge verwenden.
# Für CCU3/RaspberryMatic: enabled=true und mode="ccu_xml_rpc" setzen.
enabled = false
mode = "home_assistant_mqtt"
ccu_host = "127.0.0.1"
ccu_port = 2010
poll_interval_ms = 2000
request_timeout_ms = 2500
# Direkte setValue-Aufrufe bleiben gesperrt, bis dies plus Datenpunkt + Policy aktiviert wurde.
allow_writes = false

[commands]
enabled = true
mode = "open_lab_sandbox"
default_deny = true
allow_retained = false
default_ttl_secs = 30
max_ttl_secs = 300
max_future_skew_secs = 30
publish_lifecycle_acks = true
ack_qos = 1
ack_retain = false

[storage]
state_dir = "/var/lib/netcore-iot-gateway"
outbox_dir = "outbox"
dedup_file = "dedup.json"
command_inbox_file = "command-inbox.ndjson"
command_ledger_file = "command-ledger.json"
command_audit_file = "command-audit.ndjson"
virtual_state_file = "virtual-device-state.json"
external_state_file = "external-entity-state.json"
homematic_state_file = "homematic-datapoint-state.json"
dedup_limit = 50000
outbox_limit = 20000
command_ledger_limit = 50000

[polling]
interval_ms = 2000
batch_limit = 500
request_timeout_ms = 2500

# Default Deny: Nur Commands, die eine aktive Allow-Policy treffen, werden ausgeführt.
[[command_policies]]
id = "allow-openlab-virtual-relays"
enabled = true
effect = "allow"
command_types = ["virtual.relay.set"]
target_types = ["virtual_relay"]
target_prefixes = ["lab-"]
max_ttl_secs = 120
allow_dry_run = true

[[command_policies]]
id = "allow-openlab-virtual-lights"
enabled = true
effect = "allow"
command_types = ["virtual.light.set"]
target_types = ["virtual_light"]
target_prefixes = ["lab-"]
max_ttl_secs = 120
allow_dry_run = true

[[command_policies]]
id = "allow-openlab-virtual-buttons"
enabled = true
effect = "allow"
command_types = ["virtual.button.press"]
target_types = ["virtual_button"]
target_prefixes = ["lab-"]
max_ttl_secs = 60
allow_dry_run = true

# Vorbereitet, aber bewusst deaktiviert. Aktivierung erlaubt nur input_boolean.netcore_lab_*.
[[command_policies]]
id = "allow-openlab-homeassistant-lab-bridge"
enabled = false
effect = "allow"
command_types = ["homeassistant.entity.command"]
target_types = ["home_assistant_entity"]
target_prefixes = ["input_boolean.netcore_lab_"]
max_ttl_secs = 60
allow_dry_run = true

# Vorbereitet, aber bewusst deaktiviert. Zusätzlich sind homematic.allow_writes=true
# und writable=true am konkreten Datenpunkt nötig.
[[command_policies]]
id = "allow-openlab-homematic-lab-writes"
enabled = false
effect = "allow"
command_types = ["homematic.datapoint.set"]
target_types = ["homematic_datapoint"]
target_prefixes = ["lab-"]
max_ttl_secs = 60
allow_dry_run = true

# Beispiel für CCU3/RaspberryMatic – zum Aktivieren als [[homematic_datapoints]]
# unkommentiert übernehmen. HmIP-Datenpunkte liegen typischerweise an Port 2010.
# [[homematic_datapoints]]
# id = "rack_temperature"
# name = "Rack Temperatur"
# enabled = true
# address = "000A1B2C3D4E5F:1"
# parameter = "ACTUAL_TEMPERATURE"
# value_type = "float"
# platform = "sensor"
# device_class = "temperature"
# unit = "°C"
# writable = false

# [[homematic_datapoints]]
# id = "lab-relay-ccu"
# name = "Lab Relais CCU"
# enabled = true
# address = "000A1B2C3D4E5F:4"
# parameter = "STATE"
# value_type = "bool"
# platform = "switch"
# writable = true

[[sources]]
id = "node-gateway"
url = "http://10.0.20.10:8080/api/v1/events/netcore"
enabled = true

[[sources]]
id = "mobility-core"
url = "http://10.0.20.11:8090/api/v1/events/netcore"
enabled = true

[[sources]]
id = "call-control"
url = "http://10.0.20.14:8120/api/v1/events/netcore"
enabled = true

[[sources]]
id = "sds-router"
url = "http://10.0.20.17:8150/api/v1/events/netcore"
enabled = true
