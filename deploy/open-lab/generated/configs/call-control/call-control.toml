# NETCORE-KOMMENTAR – Was: Enthält einen Teil der Logik für Rufaufbau, Rufzustände und Rufwiederherstellung.
# NETCORE-KOMMENTAR – Warum: Die Trennung in eine eigene Datei macht Zuständigkeit, Wartung und Fehlersuche übersichtlicher.

# Was: Öffnet den Konfigurationsabschnitt `server`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[server]
# Was: Setzt die Einstellung `bind` für server.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
bind = "0.0.0.0:8120"
# Was: Setzt die Einstellung `history_limit` für server.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
history_limit = 2000

# Was: Öffnet den Konfigurationsabschnitt `node_gateway`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[node_gateway]
# Was: Setzt die Einstellung `url` für Netzknoten Gateway.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
url = "ws://10.0.20.10:8080/ws/backend"
# Was: Setzt die Einstellung `reconnect_secs` für Netzknoten Gateway.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
reconnect_secs = 5

# Was: Öffnet den Konfigurationsabschnitt `storage`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[storage]
# Was: Setzt die Einstellung `database_path` für storage.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
database_path = "/var/lib/netcore-call-control/calls.json"
# Was: Setzt die Einstellung `backup_path` für storage.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
backup_path = "/var/lib/netcore-call-control/calls.json.bak"

# Was: Öffnet den Konfigurationsabschnitt `calls`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[calls]
# Was: Setzt die Einstellung `command_timeout_secs` für calls.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
command_timeout_secs = 30
# Was: Setzt die Einstellung `restore_timeout_secs` für calls.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
restore_timeout_secs = 45
# Was: Setzt die Einstellung `reconcile_interval_secs` für calls.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
reconcile_interval_secs = 2
# Was: Setzt die Einstellung `auto_target_affiliated_nodes` für calls.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
auto_target_affiliated_nodes = true
# Was: Setzt die Einstellung `release_partial_start_on_failure` für calls.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
release_partial_start_on_failure = false
# Was: Setzt die Einstellung `allow_operator_force_floor` für calls.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
allow_operator_force_floor = true

# Was: Öffnet den Konfigurationsabschnitt `security`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[security]
# Was: Setzt die Einstellung `mode` für Sicherheit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
mode = "open_lab"
# Was: Setzt die Einstellung `allow_remote_management` für Sicherheit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
allow_remote_management = true

# Was: Öffnet den Konfigurationsabschnitt `limits`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[limits]
# Was: Setzt die Einstellung `max_body_bytes` für limits.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_body_bytes = 2097152
# Was: Setzt die Einstellung `max_calls` für limits.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_calls = 100000
# Was: Setzt die Einstellung `max_legs_per_call` für limits.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_legs_per_call = 1024
# Was: Setzt die Einstellung `max_pending_commands` für limits.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_pending_commands = 20000
