# Was: Öffnet den Konfigurationsabschnitt `policy`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[policy]
# shadow: Workflows and OTAR actions are prepared but never released to an Edge.
# authoritative: approved and queued OTAR actions can be claimed by matching TBS nodes.
# Was: Setzt die Einstellung `operating_mode` für policy.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
operating_mode = "shadow"
# Was: Setzt die Einstellung `default_key_bytes` für policy.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
default_key_bytes = 16
# Was: Setzt die Einstellung `default_crypto_period_secs` für policy.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
default_crypto_period_secs = 86400
# Was: Setzt die Einstellung `rotation_lead_secs` für policy.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
rotation_lead_secs = 3600
# Was: Setzt die Einstellung `require_dual_approval` für policy.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
require_dual_approval = true
# Was: Setzt die Einstellung `allow_overlapping_crypto_periods` für policy.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
allow_overlapping_crypto_periods = true
# Was: Setzt die Einstellung `auto_retire_predecessor` für policy.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
auto_retire_predecessor = true

# Was: Öffnet den Konfigurationsabschnitt `vault`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[vault]
# Integration provider only. It keeps encrypted blobs separate from metadata.
# It is not a production HSM and the lab envelope is not a certified cipher.
# Was: Setzt die Einstellung `provider` für vault.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
provider = "lab_file_vault"
# Was: Setzt die Einstellung `master_key_bytes` für vault.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
master_key_bytes = 32
# Was: Setzt die Einstellung `fsync` für vault.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
fsync = true
# hsm_library = "/usr/lib/x86_64-linux-gnu/pkcs11/vendor.so"
# hsm_slot = 0

