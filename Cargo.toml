# NETCORE-KOMMENTAR – Was: Beschreibt das Rust-Paket, seine Abhängigkeiten und seine aktivierbaren Funktionen.
# NETCORE-KOMMENTAR – Warum: Die Trennung in eine eigene Datei macht Zuständigkeit, Wartung und Fehlersuche übersichtlicher.

# Was: Öffnet den Konfigurationsabschnitt `workspace`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[workspace]
# Was: Wählt die Cargo-Regeln zur Auflösung von Funktionen und Abhängigkeiten.
# Warum: Abhängigkeiten werden dadurch nach den für den Arbeitsbereich erwarteten Regeln kombiniert.
resolver = "2"

# Was: Listet die Pakete auf, die zum gemeinsamen Cargo-Arbeitsbereich gehören.
# Warum: Alle Komponenten lassen sich dadurch zusammen bauen, prüfen und versionieren.
members = [
    # Core libraries
    "crates/tetra-core",
    "crates/tetra-saps",
    "crates/tetra-config",
    "crates/tetra-pdus",
    "crates/tetra-entities",
    
    # Binaries
    "bins/bluestation-bs",
    "bins/netcore-control-room",
    "system-backend/control-room/operator",
    "system-backend/node-gateway",
    "system-backend/mobility-core",
    "system-backend/subscriber-core",
    "system-backend/group-core",
    "system-backend/call-control",
    "system-backend/media-switch",
    "system-backend/recorder",
    "system-backend/sds-router",
    "system-backend/packet-core",
    "system-backend/ip-gateway",
    "system-backend/security-core",
    "system-backend/kmf",
    "system-backend/transit",
    "system-backend/observability",
    "system-backend/application-gateway",
    "system-backend/media-library",
    "system-backend/shared/contracts",
    "system-backend/shared/service-common",
    "system-backend/shared/database-common",
    "system-backend/shared/telemetry-common",
    #"bins/bluestation-telemetry",
    #"bins/bluestation-control",
    #"bins/pdu-tool",
]

# Clippy lint policy for the whole workspace.
#
# These are pre-existing *style / complexity / pedantic* lints that this codebase has
# chosen not to enforce. They carry no correctness impact, and many of clippy's suggested
# rewrites are marked `MaybeIncorrect` (e.g. removing a `return;` from a divergent
# `let ... else { … }` block does not compile), so applying them en masse to protocol-
# critical PHY/MAC/CMCE code would risk regressions for zero functional gain.
#
# Allowing them centrally keeps `cargo clippy` clean and actionable: any *correctness*,
# *suspicious*, or *perf-bug* lint (which are NOT listed here) will still surface as a
# warning. Revisit individual entries if/when the relevant code is rewritten anyway.
