# Was: Setzt die Einstellung `start` für package metadata deb systemd units.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
start = false
# Was: Setzt die Einstellung `restart-after-upgrade` für package metadata deb systemd units.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
