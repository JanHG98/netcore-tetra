# ── Debian package (.deb) — built in CI by cargo-deb ───────────────────────────
# Ships the prebuilt aarch64 binary + a systemd service + a default config, so a
# Raspberry Pi 4/5 user can `apt install ./flowstation_*.deb` instead of compiling.
# Asterisk SIP voice is NOT in this package (default features; no native codec).
# Runtime requirement: SoapySDR >= 0.8 and the SXceiver SoapySDR module must be
# present on the device (provided by the image / your SDR setup).
# Was: Öffnet den Konfigurationsabschnitt `package.metadata.deb`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[package.metadata.deb]
# Was: Legt den technischen Namen des Pakets oder Dienstes fest.
# Warum: Build-Werkzeuge und andere Komponenten können es dadurch eindeutig ansprechen.
name = "flowstation"
# Was: Setzt die Einstellung `maintainer` für package metadata deb.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
maintainer = "Razvan Zeces <razvan@zeces.ro>"
# Was: Setzt die Einstellung `copyright` für package metadata deb.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
copyright = "2026, Razvan Zeces / FlowStation.Dev"
# Was: Setzt die Einstellung `section` für package metadata deb.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
section = "comm"
# Was: Setzt die Einstellung `priority` für package metadata deb.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
priority = "optional"
# Was: Setzt die Einstellung `depends` für package metadata deb.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
depends = "libc6"
# Was: Setzt die Einstellung `extended-description` für package metadata deb.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
extended-description = """\
FlowStation TETRA base station (bluestation-bs) — prebuilt aarch64 binary with a \
systemd service and a default configuration. Configure it from the web dashboard \
(http://flowstation.local once running). Requires a SoapySDR-supported SDR \
(SXceiver) on the device. Asterisk SIP/PSTN voice is not included in this package."""
# Was: Setzt die Einstellung `conf-files` für package metadata deb.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
conf-files = ["/etc/flowstation/config.toml"]
# Was: Setzt die Einstellung `assets` für package metadata deb.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
assets = [
    ["target/release/bluestation-bs", "usr/bin/bluestation-bs", "755"],
    ["../../example_config/config.toml", "etc/flowstation/config.toml", "644"],
    ["../../README.md", "usr/share/doc/flowstation/README.md", "644"],
]

# Was: Öffnet den Konfigurationsabschnitt `package.metadata.deb.systemd-units`.
