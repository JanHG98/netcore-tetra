# NETCORE-KOMMENTAR – Was: Beschreibt das Rust-Paket, seine Abhängigkeiten und seine aktivierbaren Funktionen.
# NETCORE-KOMMENTAR – Warum: Die Trennung in eine eigene Datei macht Zuständigkeit, Wartung und Fehlersuche übersichtlicher.

# Was: Öffnet den Konfigurationsabschnitt `package`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[package]
