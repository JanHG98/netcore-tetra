name: Radio traffic regression tests

on:
  pull_request:
    branches: [mqtt]
    paths:
      - system-backend/sip-switch/**
      - system-backend/media-switch/**
      - system-backend/call-control/**
      - crates/tetra-saps/**
      - crates/tetra-config/src/bluestation/sec_asterisk.rs
      - crates/tetra-entities/src/net_media/**
      - crates/tetra-entities/src/net_control_room/**
      - crates/tetra-entities/src/mm/**
      - tools/test_sip_network_runtime.py
      - tools/test_sip_number_routing.py
      - crates/tetra-entities/src/phy/**
      - crates/tetra-entities/src/lmac/**
      - crates/tetra-entities/src/umac/**
      - crates/tetra-entities/src/cmce/**
      - crates/tetra-entities/src/net_recorder/**
      - crates/tetra-entities/src/net_asterisk/**
      - crates/tetra-entities/src/net_brew/**
      - crates/tetra-entities/src/network/**
      - .github/workflows/phy-slotter-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slotter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev libgsm1-dev pkg-config cmake
      - name: Build and install bundled speech codec
        run: |
          cmake -S tetra-codec-master -B "$RUNNER_TEMP/tetra-codec-build" -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$RUNNER_TEMP/tetra-codec-build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/tetra-codec-build"
          sudo ldconfig
      - name: Test downlink phase adjustment and burst vectors
        run: |
          cargo test -p tetra-entities --features recording,asterisk --lib phy::components::slotter::tests:: -- --nocapture
      - name: Test carrier mapping and continuous TX waveforms
        run: |
          cargo test -p tetra-entities --features recording,asterisk --lib phy::components::soapy_dev::tests:: -- --nocapture
      - name: Test assigned control, group lifecycle and asynchronous recording
        run: |
          test_status=0
          cargo test -p tetra-config --lib bluestation::sec_asterisk::tests:: -- --nocapture || test_status=1
          for test_filter in umac::subcomp::bs_sched::tests:: lmac::lmac_bs::tests:: cmce::subentities::cc_bs::pdu::tests:: net_recorder::entity::tests:: net_asterisk:: net_brew::entity::tests:: network::transports::websocket::tests::; do
            cargo test -p tetra-entities --features recording,asterisk --lib "$test_filter" -- --nocapture || test_status=1
          done
          exit "$test_status"
      - name: Test central SIP routing and fallback
        run: |
          python3 tools/check_sip_switch_phase11.py
          python3 tools/check_sip_switch_phase11c.py
          python3 tools/test_sip_network_runtime.py
          python3 tools/test_sip_number_routing.py
      - name: Test central call and media adapters
        run: |
          cargo test -p tetra-entities --features recording,asterisk --lib central_control -- --nocapture
          cargo test -p tetra-entities --features recording,asterisk --lib central_media -- --nocapture
          cargo test --manifest-path system-backend/call-control/Cargo.toml
          cargo test --manifest-path system-backend/media-switch/Cargo.toml
      - name: Build the base station
        run: cargo build --release -p bluestation-bs
