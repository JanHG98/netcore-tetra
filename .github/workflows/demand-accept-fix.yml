name: demand-accept-fix

on:
  push:
    branches:
      - mqtt-fix/demand-accept-type

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mqtt-fix/demand-accept-type
          fetch-depth: 0

      - name: Preserve DemandLocationUpdating in D-LOCATION-UPDATE-ACCEPT
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/tetra-entities/src/mm/mm_bs.rs')
          s = p.read_text()
          old = '''        // A retained client record does not mean this is not a genuine fresh attach:\n        // T351/recovery intentionally keeps client_mgr state across RF absence. Preserve the\n        // requested ITSI-attach type for this capability class regardless of `is_new`; only\n        // later RoamingLocationUpdating is converted to PeriodicLocationUpdating.\n        if itsi_attach_accept_compat && requested == LocationUpdateType::ItsiAttach {\n            return LocationUpdateType::ItsiAttach;\n        }\n\n        LocationUpdateType::PeriodicLocationUpdating\n'''
          new = '''        // Infrastructure-initiated registration is its own MM transaction:\n        // D-LOCATION-UPDATE-COMMAND -> U-LOCATION-UPDATE-DEMAND(DemandLocationUpdating)\n        // -> D-LOCATION-UPDATE-ACCEPT(DemandLocationUpdating). Do not rewrite that final ACCEPT\n        // to PeriodicLocationUpdating just because T351-style periodic registration is enabled.\n        // Some terminals otherwise keep the service locally unavailable and continue roaming\n        // refreshes even though the SwMI already considers them registered.\n        if requested == LocationUpdateType::DemandLocationUpdating {\n            return LocationUpdateType::DemandLocationUpdating;\n        }\n\n        // A retained client record does not mean this is not a genuine fresh attach:\n        // T351/recovery intentionally keeps client_mgr state across RF absence. Preserve the\n        // requested ITSI-attach type for this capability class regardless of `is_new`; only\n        // later RoamingLocationUpdating is converted to PeriodicLocationUpdating.\n        if itsi_attach_accept_compat && requested == LocationUpdateType::ItsiAttach {\n            return LocationUpdateType::ItsiAttach;\n        }\n\n        LocationUpdateType::PeriodicLocationUpdating\n'''
          if old not in s:
              raise SystemExit('target accept-type block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify targeted behavior
        shell: bash
        run: |
          set -euxo pipefail
          grep -A12 -B3 'requested == LocationUpdateType::DemandLocationUpdating' crates/tetra-entities/src/mm/mm_bs.rs
          grep -q 'return LocationUpdateType::DemandLocationUpdating;' crates/tetra-entities/src/mm/mm_bs.rs

      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsoapysdr-dev pkg-config

      - name: Format and compile
        run: |
          cargo fmt --all
          cargo check -p tetra-entities --lib

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/demand-accept-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tetra-entities/src/mm/mm_bs.rs .github/workflows/demand-accept-fix.yml
          git commit -m "fix(tbs): acknowledge demand location update as demand"
          git push origin HEAD:mqtt-fix/demand-accept-type
