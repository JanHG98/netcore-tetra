name: rf-v170-timing-fix

on:
  push:
    branches:
      - mqtt-fix/rf-v170-timing

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mqtt-fix/rf-v170-timing
          fetch-depth: 0

      - name: Restore v1.7 idle RF timing and bound media work
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/tetra-entities/src/umac/umac_bs.rs')
          s = p.read_text()

          old = '''    fn drain_media_downlink(&mut self) {\n        let mut frames = Vec::new();\n        let mut disconnected = false;\n        if let Some(source) = self.media_downlink_source.as_ref() {\n            for _ in 0..64 {\n'''
          new = '''    fn drain_media_downlink(&mut self) {\n        // Keep the idle/control-channel path identical to the known-good v1.7.0\n        // runtime.  The Media Switch bridge was added after v1.7.0 and originally\n        // polled its queue on every TDMA tick, even while no downlink traffic\n        // circuit existed.  A busy/stale central media queue must never steal time\n        // from MCCH/SYSINFO/registration processing.\n        let mut has_active_dl = false;\n        for logical_ts in 2..=7u8 {\n            if Self::is_secondary_logical_ts(logical_ts) && self.secondary_carrier().is_none() {\n                continue;\n            }\n            let carrier_num = self.carrier_for_logical_ts(logical_ts);\n            let air_ts = Self::air_ts_for_logical(logical_ts);\n            if self.scheduler_for(carrier_num).circuit_is_active(Direction::Dl, air_ts) {\n                has_active_dl = true;\n                break;\n            }\n        }\n        if !has_active_dl {\n            return;\n        }\n\n        let mut frames = Vec::new();\n        let mut disconnected = false;\n        if let Some(source) = self.media_downlink_source.as_ref() {\n            // Bound central-media work per TDMA tick.  Eight queued speech frames\n            // already provide far more throughput than one TETRA traffic channel\n            // needs, while preventing a burst from delaying the RF scheduler.\n            for _ in 0..8 {\n'''
          if old not in s:
              raise SystemExit('media drain block not found')
          s = s.replace(old, new, 1)

          old_tick = '''    fn tick_start(&mut self, queue: &mut MessageQueue, ts: TdmaTime) {\n        self.dltime = ts;\n        self.drain_media_downlink();\n        self.refresh_system_wide_services();\n'''
          new_tick = '''    fn tick_start(&mut self, queue: &mut MessageQueue, ts: TdmaTime) {\n        self.dltime = ts;\n        self.refresh_system_wide_services();\n'''
          if old_tick not in s:
              raise SystemExit('tick_start preamble not found')
          s = s.replace(old_tick, new_tick, 1)

          old_tail = '''        queue.push_back(s);\n\n        self.process_pending_circuit_closes();\n    }\n}\n'''
          new_tail = '''        queue.push_back(s);\n\n        self.process_pending_circuit_closes();\n\n        // Central media is deliberately serviced only after the current RF slot\n        // has been finalized.  This preserves the v1.7.0 control-channel timing\n        // contract and adds at most one TDMA-slot of media latency.\n        self.drain_media_downlink();\n    }\n}\n'''
          if old_tail not in s:
              raise SystemExit('tick_start tail not found')
          s = s.replace(old_tail, new_tail, 1)

          p.write_text(s)
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          set -euxo pipefail
          grep -n -A35 'fn drain_media_downlink' crates/tetra-entities/src/umac/umac_bs.rs
          grep -n -A55 'fn tick_start' crates/tetra-entities/src/umac/umac_bs.rs | tail -n 60
          ! grep -q 'for _ in 0..64' crates/tetra-entities/src/umac/umac_bs.rs

      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsoapysdr-dev pkg-config

      - name: Format and compile
        run: |
          cargo fmt --all
          cargo check -p tetra-entities --lib
          cargo check -p bluestation-bs

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/rf-v170-timing-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tetra-entities/src/umac/umac_bs.rs .github/workflows/rf-v170-timing-fix.yml
          git commit -m "fix(tbs): isolate central media from RF tick timing"
          git push origin HEAD:mqtt-fix/rf-v170-timing
