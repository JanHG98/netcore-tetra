# NETCORE-KOMMENTAR – Was: Beschreibt einen automatischen GitHub-Arbeitsablauf für Prüfung oder Veröffentlichung.
# NETCORE-KOMMENTAR – Warum: Die Trennung in eine eigene Datei macht Zuständigkeit, Wartung und Fehlersuche übersichtlicher.

# Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
# Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
name: SWMI Mobility Call Restore

# Was: Legt fest, bei welchen Ereignissen der Workflow startet.
# Warum: Automatische Prüfungen sollen nur zu den vorgesehenen Zeitpunkten Ressourcen verbrauchen.
on:
  # Was: Legt den YAML-Bereich oder Wert `push` fest.
  # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
  push:
    # Was: Legt den YAML-Bereich oder Wert `paths` fest.
    # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
    paths:
      - "crates/tetra-saps/src/control/mle_cell_change.rs"
      - "crates/tetra-entities/src/cmce/**"
      - "crates/tetra-entities/src/mle/**"
      - "crates/tetra-entities/tests/test_call_restore_runtime.rs"
      - "crates/tetra-entities/tests/test_two_cell_call_restore.rs"
      - "crates/tetra-entities/tests/test_mle_cell_change_runtime.rs"
      - "crates/tetra-entities/tests/test_two_cell_mobility.rs"
      - "crates/tetra-entities/tests/common/**"
      - "tools/check_mle_cell_change.py"
      - "tools/check_cmce_call_restore.py"
      - ".github/workflows/swmi-mobility-call-restore.yml"
  # Was: Legt den YAML-Bereich oder Wert `pull_request` fest.
  # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
  pull_request:
    # Was: Legt den YAML-Bereich oder Wert `paths` fest.
    # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
    paths:
      - "crates/tetra-saps/src/control/mle_cell_change.rs"
      - "crates/tetra-entities/src/cmce/**"
      - "crates/tetra-entities/src/mle/**"
      - "crates/tetra-entities/tests/test_call_restore_runtime.rs"
      - "crates/tetra-entities/tests/test_two_cell_call_restore.rs"
      - "crates/tetra-entities/tests/test_mle_cell_change_runtime.rs"
      - "crates/tetra-entities/tests/test_two_cell_mobility.rs"
      - "crates/tetra-entities/tests/common/**"
      - "tools/check_mle_cell_change.py"
      - "tools/check_cmce_call_restore.py"
      - ".github/workflows/swmi-mobility-call-restore.yml"

# Was: Beginnt die Liste der auszuführenden Aufgaben.
# Warum: Unabhängige Prüf- und Build-Schritte bleiben dadurch klar voneinander getrennt.
jobs:
  # Was: Legt den YAML-Bereich oder Wert `mobility-call-restore` fest.
  # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
  mobility-call-restore:
    # Was: Legt den YAML-Bereich oder Wert `runs-on` fest.
    # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
    runs-on: ubuntu-latest
    # Was: Listet die einzelnen Schritte einer Aufgabe auf.
    # Warum: Die Reihenfolge von Vorbereitung, Build und Prüfung wird dadurch eindeutig festgelegt.
    steps:
      # Was: Verwendet eine fertige GitHub-Action.
      # Warum: Bewährte Standardaufgaben müssen dadurch nicht als fehleranfälliges eigenes Skript nachgebaut werden.
      - uses: actions/checkout@v4
      # Was: Verwendet eine fertige GitHub-Action.
      # Warum: Bewährte Standardaufgaben müssen dadurch nicht als fehleranfälliges eigenes Skript nachgebaut werden.
      - uses: dtolnay/rust-toolchain@stable
        # Was: Übergibt Parameter an die verwendete Action.
        # Warum: Das Verhalten der Action wird dadurch ausdrücklich und nachvollziehbar konfiguriert.
        with:
          # Was: Legt den YAML-Bereich oder Wert `components` fest.
          # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
          components: rustfmt, clippy
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Static architecture checks
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: |
          python3 tools/check_swmi_foundation_types.py
          python3 tools/check_tlmc_runtime.py
          python3 tools/check_ltpd_runtime.py
          python3 tools/check_foundation_acceptance.py
          python3 tools/check_mle_cell_change.py
          python3 tools/check_cmce_call_restore.py
          python3 tools/protocol_inventory.py --check
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Formatting
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: cargo fmt --all -- --check
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Call restoration tests
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: |
          cargo test -p tetra-saps
          cargo test -p tetra-pdus --test test_mle_cell_change_pdus
          cargo test -p tetra-entities --test test_mle_cell_change_runtime
          cargo test -p tetra-entities --test test_call_restore_runtime
          cargo test -p tetra-entities --test test_two_cell_foundation
          cargo test -p tetra-entities --test test_two_cell_mobility
          cargo test -p tetra-entities --test test_two_cell_call_restore
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Clippy
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: cargo clippy -p tetra-saps -p tetra-pdus -p tetra-entities --all-targets -- -D warnings
