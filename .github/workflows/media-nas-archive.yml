name: Media NAS archive and recall
on:
  pull_request:
    paths:
      - 'system-backend/media-library/**'
      - 'tools/test_media_nas_archive.py'
      - '.github/workflows/media-nas-archive.yml'
      - 'Docs/services/media-library/dateien-und-archivstruktur.md'
  push:
    branches: [main]
    paths:
      - 'system-backend/media-library/**'
      - 'tools/test_media_nas_archive.py'
      - '.github/workflows/media-nas-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify archive, eviction, recall, restart and open file ownership
        run: cargo test --locked -p netcore-media-library
      - name: Real HTTP archive, NAS outage, recall and basis-station WAV delivery
        run: |
          cargo build --locked -p netcore-media-library
          python3 -B tools/test_media_nas_archive.py -v

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render deployment profile from canonical templates
        run: |
          python3 deploy/open-lab/netcore-deploy.py render
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('deploy/open-lab/generated/configs/media-library/media-library.toml')
          print('NETCORE_MEDIA_GENERATED_JSON=' + json.dumps(path.read_text(), ensure_ascii=True))
          PY
