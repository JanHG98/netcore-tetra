# NETCORE-KOMMENTAR – Was: Beschreibt einen automatischen GitHub-Arbeitsablauf für Prüfung oder Veröffentlichung.
# NETCORE-KOMMENTAR – Warum: Die Trennung in eine eigene Datei macht Zuständigkeit, Wartung und Fehlersuche übersichtlicher.

# Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
# Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
name: SWMI foundation TLMC runtime

# Was: Legt fest, bei welchen Ereignissen der Workflow startet.
# Warum: Automatische Prüfungen sollen nur zu den vorgesehenen Zeitpunkten Ressourcen verbrauchen.
on:
  # Was: Legt den YAML-Bereich oder Wert `push` fest.
  # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
  push:
    # Was: Legt den YAML-Bereich oder Wert `paths` fest.
    # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
    paths:
      - "crates/tetra-saps/src/common/**"
      - "crates/tetra-saps/src/tlmc/**"
      - "crates/tetra-saps/src/sapmsg.rs"
      - "crates/tetra-entities/src/umac/**"
      - "crates/tetra-entities/src/mle/mle_bs.rs"
      - "crates/tetra-entities/src/mle/mle_ms.rs"
      - "crates/tetra-entities/tests/test_tlmc_runtime.rs"
      - "tools/check_tlmc_runtime.py"
      - "tools/protocol_inventory.py"
      - "Docs/TLMC_TLPD_WORKLIST.md"
      - "Docs/SWMI_FOUNDATION_1_PACKAGE_C*.md"
      - "Docs/generated/**"
      - ".github/workflows/swmi-foundation-tlmc-runtime.yml"
  # Was: Legt den YAML-Bereich oder Wert `pull_request` fest.
  # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
  pull_request:
    # Was: Legt den YAML-Bereich oder Wert `paths` fest.
    # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
    paths:
      - "crates/tetra-saps/src/common/**"
      - "crates/tetra-saps/src/tlmc/**"
      - "crates/tetra-saps/src/sapmsg.rs"
      - "crates/tetra-entities/src/umac/**"
      - "crates/tetra-entities/src/mle/mle_bs.rs"
      - "crates/tetra-entities/src/mle/mle_ms.rs"
      - "crates/tetra-entities/tests/test_tlmc_runtime.rs"
      - "tools/check_tlmc_runtime.py"
      - "tools/protocol_inventory.py"
      - "Docs/TLMC_TLPD_WORKLIST.md"
      - "Docs/SWMI_FOUNDATION_1_PACKAGE_C*.md"
      - "Docs/generated/**"
      - ".github/workflows/swmi-foundation-tlmc-runtime.yml"

# Was: Beginnt die Liste der auszuführenden Aufgaben.
# Warum: Unabhängige Prüf- und Build-Schritte bleiben dadurch klar voneinander getrennt.
jobs:
  # Was: Legt den YAML-Bereich oder Wert `tlmc-runtime` fest.
  # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
  tlmc-runtime:
    # Was: Legt den YAML-Bereich oder Wert `runs-on` fest.
    # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
    runs-on: ubuntu-latest
    # Was: Listet die einzelnen Schritte einer Aufgabe auf.
    # Warum: Die Reihenfolge von Vorbereitung, Build und Prüfung wird dadurch eindeutig festgelegt.
    steps:
      # Was: Verwendet eine fertige GitHub-Action.
      # Warum: Bewährte Standardaufgaben müssen dadurch nicht als fehleranfälliges eigenes Skript nachgebaut werden.
      - uses: actions/checkout@v4
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Install native runtime dependency
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Verify Package C static invariants
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: python3 tools/check_tlmc_runtime.py
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Verify Package B type invariants
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: python3 tools/check_swmi_foundation_types.py
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Verify generated protocol inventory
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: python3 tools/protocol_inventory.py --check
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Test TLMC SAP types
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: cargo test -p tetra-saps
      # Was: Vergibt einen verständlichen Namen für diesen Workflow oder Arbeitsschritt.
      # Warum: Der Ablauf ist dadurch in GitHub und in Protokollen schnell wiederzuerkennen.
      - name: Test TLMC runtime
        # Was: Führt den angegebenen Shell-Befehl aus.
        # Warum: Der konkrete Build- oder Prüfschritt wird dadurch reproduzierbar automatisiert.
        run: cargo test -p tetra-entities --test test_tlmc_runtime
