name: stabilize-5102-mm

on:
  push:
    branches:
      - mqtt-fix/stabilize-5102-mm

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mqtt-fix/stabilize-5102-mm
          fetch-depth: 0

      - name: Transform
        run: python3 .github/scripts/stabilize_5102_mm.py

      - name: Verify
        shell: bash
        run: |
          grep -q 'roaming update settled as PeriodicLocationUpdating to stop the REREG loop' crates/tetra-entities/src/mm/mm_bs.rs
          grep -q 'ssi: None,' crates/tetra-entities/src/mm/mm_bs.rs
          grep -q 'if was_dropped && !_has_groups' crates/tetra-entities/src/mm/mm_bs.rs
          grep -Fq 'prior_esm.filter(|mode| *mode != EnergySavingMode::StayAlive)' crates/tetra-entities/src/mm/mm_bs.rs
          test -s Docs/MM_5102_STABILITY_HYBRID_FIX.md

      - name: Native deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsoapysdr-dev

      - name: Compile
        run: cargo check -p tetra-entities --lib

      - name: Commit
        shell: bash
        run: |
          git checkout -- Cargo.lock || true
          rm -f .github/workflows/stabilize-5102-mm.yml
          rm -f .github/scripts/stabilize_5102_mm.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/tetra-entities/src/mm/mm_bs.rs Docs/MM_5102_STABILITY_HYBRID_FIX.md .github/workflows/stabilize-5102-mm.yml .github/scripts/stabilize_5102_mm.py
          git commit -m 'fix(tbs): stabilize AIv2 roaming registration'
          git push origin HEAD:mqtt-fix/stabilize-5102-mm
