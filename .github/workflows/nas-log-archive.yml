name: NAS log archive
on:
  pull_request:
    paths:
      - 'tools/operator/archive-netcore-logs.py'
      - 'tests/integration/test_netcore_log_archive.py'
      - 'Docs/deployment/logarchiv-auf-nas.md'
      - '.github/workflows/nas-log-archive.yml'
  push:
    branches: [main]
    paths:
      - 'tools/operator/archive-netcore-logs.py'
      - 'tests/integration/test_netcore_log_archive.py'
      - '.github/workflows/nas-log-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Native rotation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y logrotate
      - name: Verify archives, interruption, live descriptors and native rotation
        run: sudo python3 -B -m unittest discover -s tests/integration -p test_netcore_log_archive.py -v
