<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetCore · Task Flow</title><style>
:root{color-scheme:dark;--bg:#050a10;--p:#0c1925eb;--l:#244154;--t:#eef9ff;--m:#89a7b8;--c:#45ddff;--b:#6f8cff;--g:#56e6a1;--y:#ffd05b;--r:#ff616a;--v:#b875ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 14% -5%,#143d5388,transparent 28%),radial-gradient(circle at 88% 0,#341a5b55,transparent 25%),linear-gradient(145deg,#050a10,#09141f);color:var(--t);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#45ddff0c 1px,transparent 1px),linear-gradient(90deg,#45ddff0c 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(#000,transparent 90%)}@keyframes in{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}@keyframes flow{to{background-position:120px 0}}@keyframes pulse{50%{box-shadow:0 0 0 8px #45ddff0d,0 0 30px #45ddff22}}@keyframes blocked{50%{box-shadow:0 0 0 7px #ff616a0e,0 0 30px #ff616a20}}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:12px;padding:13px 20px;background:#050b12df;border-bottom:1px solid #244154aa;backdrop-filter:blur(16px)}.sig{width:36px;height:30px;display:flex;align-items:end;gap:3px}.sig i{display:block;width:4px;border-radius:4px;background:var(--c);box-shadow:0 0 10px #45ddff55}.sig i:nth-child(1){height:8px}.sig i:nth-child(2){height:14px}.sig i:nth-child(3){height:21px}.sig i:nth-child(4){height:28px;animation:pulse 2s infinite}.brand b{font-size:13px;letter-spacing:.15em}.brand div{font-size:9px;color:var(--m);letter-spacing:.11em}.health{display:flex;gap:7px;margin-left:auto}.pill{font-size:10px;color:var(--m);border:1px solid var(--l);background:#10212dbd;padding:6px 9px;border-radius:999px}.pill.ok{color:#95f7c0;border-color:#56e6a155}.pill.bad{color:#ff9aa0;border-color:#ff616a55}.lab{color:#ffdc84;border-color:#ffd05b55}.clock{min-width:82px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}main{position:relative;z-index:1;max-width:1900px;margin:auto;padding:20px}.hero{display:grid;grid-template-columns:1.5fr .68fr;gap:14px}.panel{background:linear-gradient(145deg,#0c1b28ed,#08131deb);border:1px solid var(--l);border-radius:17px;box-shadow:0 22px 55px #0005}.command{padding:23px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow{font-size:10px;color:var(--c);font-weight:900;letter-spacing:.17em}.command h1{font-size:clamp(30px,4vw,50px);margin:7px 0;line-height:1;letter-spacing:-.04em}.command p{margin:0;color:var(--m);max-width:800px}.flowbar{height:4px;margin:20px 0 10px;border-radius:999px;background:repeating-linear-gradient(90deg,#45ddff 0 18px,#45ddff22 18px 30px);background-size:120px 100%;animation:flow 2.2s linear infinite;box-shadow:0 0 14px #45ddff33}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{cursor:pointer;color:var(--t);border:1px solid #31566e;background:#102838;padding:8px 10px;border-radius:9px;transition:.15s}.btn:hover{transform:translateY(-1px);border-color:#45ddff99}.btn.primary{background:#0b6887;border-color:#2792b5}.btn.red{background:#62242b;border-color:#a53c45}.stats{padding:16px}.stats h3{margin:0 0 10px;font-size:13px}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi{padding:12px;background:#07131dbb;border:1px solid #24415488;border-radius:12px}.kpi b{display:block;font-size:25px}.kpi span{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.09em}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:14px 0 10px}.toolbar h2{font-size:16px;margin:0}.spacer{flex:1}.search{min-width:230px;background:#06131c;color:var(--t);border:1px solid var(--l);border-radius:9px;padding:8px 10px}.chip{cursor:pointer;color:var(--m);font-size:10px;border:1px solid var(--l);background:#0a1c28;padding:6px 8px;border-radius:999px}.chip.on{color:var(--t);border-color:#45ddff77;background:#45ddff12}.kanban{display:grid;grid-template-columns:repeat(5,minmax(245px,1fr));gap:10px;overflow:auto;padding:2px 2px 10px}.lane{min-height:600px;background:#08151f9e;border:1px solid #203a4c;border-radius:15px;padding:10px;transition:.15s}.lane.over{border-color:#45ddffaa;background:#0b2130}.lane-head{display:flex;align-items:center;gap:7px;padding:3px 3px 10px}.lane-head b{font-size:11px;text-transform:uppercase;letter-spacing:.1em}.lane-head span{margin-left:auto;color:var(--m);font-size:10px}.cards{display:grid;gap:8px}.task{--s:var(--c);position:relative;background:linear-gradient(120deg,color-mix(in srgb,var(--s) 6%,#0d1d29),#091721 50%);border:1px solid color-mix(in srgb,var(--s) 27%,#244154);border-radius:13px;padding:12px 12px 11px 14px;animation:in .24s ease;cursor:grab}.task:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--s);box-shadow:0 0 14px var(--s)}.task:hover{border-color:color-mix(in srgb,var(--s) 55%,#244154)}.task.drag{opacity:.45}.task.blocked{animation:in .24s ease,blocked 2.6s infinite}.token{font-size:9px;color:var(--s);font-weight:900;letter-spacing:.12em}.task h3{font-size:13px;margin:3px 0 5px}.desc,.muted{font-size:9px;color:var(--m)}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:8px;padding:3px 5px;border:1px solid #ffffff12;background:#ffffff08;border-radius:6px}.task-bottom{display:flex;align-items:end;gap:8px;margin-top:9px}.owner{font-size:9px;color:var(--m);flex:1}.priority{font-size:15px;font-weight:900;color:var(--s)}.empty{padding:25px 8px;text-align:center;color:#6f8998;font-size:9px;border:1px dashed #244154;border-radius:10px}.modal{position:fixed;inset:0;z-index:30;background:#010407ca;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(7px)}.modal.open{display:flex}.box{width:min(760px,100%);max-height:91vh;overflow:auto;background:#0a1925;border:1px solid #31566e;border-radius:16px;box-shadow:0 30px 90px #000a;padding:18px;animation:in .18s}.box h2{margin:0 0 14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.field input,.field select,.field textarea{width:100%;background:#06131c;color:var(--t);border:1px solid var(--l);border-radius:8px;padding:9px}.field textarea{min-height:85px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.timeline{display:grid;gap:6px}.timeline>div{padding:8px;border-left:2px solid #45ddff55;background:#07131d}.timeline b{font-size:10px}.timeline span{display:block;color:var(--m);font-size:9px;margin-top:2px}.toast{position:fixed;right:18px;bottom:18px;z-index:45;background:#0e2735;border:1px solid #45ddff66;padding:10px 13px;border-radius:10px;box-shadow:0 18px 40px #0008;animation:in .2s}.toast.bad{border-color:#ff616a77}.wap{font-size:10px;color:var(--m)}.wap a{color:var(--c);text-decoration:none}@media(max-width:1050px){.hero{grid-template-columns:1fr}.health{display:none}}@media(max-width:650px){main{padding:12px}.top{padding:10px 12px}.form{grid-template-columns:1fr}.field.wide{grid-column:auto}.search{min-width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="top"><div class="sig"><i></i><i></i><i></i><i></i></div><div class="brand"><b>NETCORE · TASK FLOW</b><div>MISSION WORKFLOW BOARD</div></div><div class="health"><span id="mq" class="pill">MQTT</span><span id="sds" class="pill">SDS</span><span class="pill lab">OPEN LAB</span></div><div id="clock" class="clock"></div></div><main><div class="hero"><section class="panel command"><div><div class="eyebrow">LIVE WORK ORDER CONTROL</div><h1 id="headline">Aufträge werden geladen…</h1><p>Aufträge als beweglicher Prozess: anlegen, zuweisen, annehmen, starten, blockieren und abschließen – inklusive SDS/WAP.</p></div><div><div class="flowbar"></div><div class="actions"><button class="btn" onclick="refresh(false)">↻ Sync</button><button class="btn primary" onclick="createOpen()">＋ Neuer Auftrag</button><span class="wap">WAP: <a href="/x">XHTML</a> · <a href="/w">WML</a></span></div></div></section><section class="panel stats"><h3>Workflow-Lage</h3><div id="kpis" class="kpis"></div></section></div><div class="toolbar"><h2>Live Board</h2><span id="total" class="chip on">0</span><div class="spacer"></div><input id="search" class="search" placeholder="Token, Titel, Ziel, Typ…" oninput="render()"><div id="filters"></div></div><div id="board" class="kanban"></div></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2 id="mt"></h2><div id="mb"></div></div></div><script>
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D={status:{},tasks:[],templates:[],events:[]},filter='active',dragId=null,busy=false,actor=localStorage.getItem('nc_task_actor')||'webui-openlab';const ACTIVE=new Set(['open','assigned','accepted','in_progress','blocked']),LANES=[['open','Eingang'],['assigned','Zugewiesen'],['in_progress','In Arbeit'],['blocked','Blockiert'],['completed','Abschluss']],COL={open:'#45ddff',assigned:'#6f8cff',accepted:'#6f8cff',in_progress:'#56e6a1',blocked:'#ff616a',completed:'#56e6a1',cancelled:'#8999a5',expired:'#ffd05b'},ACT={accept:'Annehmen',start:'Start',block:'Blockieren',complete:'Fertig',cancel:'Abbrechen',reopen:'Wieder öffnen',notify:'SDS senden',comment:'Kommentar'};
async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),t=await r.text(),j=t?JSON.parse(t):{};if(!r.ok)throw Error(j.error||t||r.statusText);return j}function health(id,ok,t){let e=$(id);e.className='pill '+(ok?'ok':'bad');e.textContent=t}function age(t){let s=Math.max(0,(Date.now()-new Date(t))/1000);return s<60?`${s|0}s`:s<3600?`${s/60|0}m`:s<86400?`${s/3600|0}h`:`${s/86400|0}d`}function actions(t){if(t.state==='open')return['accept','start','cancel','notify'];if(['assigned','accepted'].includes(t.state))return['start','block','complete','cancel','notify'];if(t.state==='in_progress')return['block','complete','cancel','notify'];if(t.state==='blocked')return['start','complete','cancel','notify'];if(['completed','cancelled','expired'].includes(t.state))return['reopen'];return[]}
function renderStatus(){let s=D.status,a=D.tasks.filter(t=>ACTIVE.has(t.state)),b=a.filter(t=>t.state==='blocked'),hi=a.filter(t=>+t.priority>=10);health('#mq',s.mqtt_connected,'MQTT '+(s.mqtt_connected?'ONLINE':'OFFLINE'));health('#sds',s.sds_router_healthy,'SDS '+(s.sds_router_healthy?'ONLINE':'OFFLINE'));$('#headline').textContent=b.length?`${b.length} blockierte Aufträge`:a.length?`${a.length} aktive Aufträge`:'Workflow leer – bereit für Arbeit';$('#kpis').innerHTML=[['Aktiv',a.length],['Blockiert',b.length],['Priorität ≥10',hi.length],['Vorlagen',s.templates||D.templates.length]].map(x=>`<div class="kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');$('#total').textContent=D.tasks.length}
function renderFilters(){let o=[['active','Aktiv'],['urgent','P≥10'],['all','Alle']];$('#filters').innerHTML=o.map(x=>`<button class="chip ${filter===x[0]?'on':''}" onclick="filter='${x[0]}';renderFilters();render()">${x[1]}</button>`).join(' ')}function visible(){let q=$('#search').value.toLowerCase();return D.tasks.filter(t=>{if(filter==='active'&&!ACTIVE.has(t.state))return false;if(filter==='urgent'&&!(ACTIVE.has(t.state)&&+t.priority>=10))return false;return !q||JSON.stringify([t.token,t.title,t.task_type,t.assigned_issi,t.assigned_gssi,t.owner,t.location]).toLowerCase().includes(q)})}function laneOf(t){return t.state==='accepted'?'assigned':t.state}function render(){let v=visible();$('#board').innerHTML=LANES.map(([id,name])=>{let a=v.filter(t=>laneOf(t)===id);return `<section class="lane" data-lane="${id}" ondragover="over(event)" ondragleave="this.classList.remove('over')" ondrop="drop(event,'${id}')"><div class="lane-head"><b>${name}</b><span>${a.length}</span></div><div class="cards">${a.length?a.map(card).join(''):'<div class="empty">Keine Aufträge</div>'}</div></section>`}).join('')}
function card(t){let dest=t.assigned_issi?`ISSI ${t.assigned_issi}`:t.assigned_gssi?`GSSI ${t.assigned_gssi}`:'nicht zugewiesen',s=COL[t.state]||'#45ddff';return `<article class="task ${t.state==='blocked'?'blocked':''}" style="--s:${s}" draggable="true" ondragstart="drag(event,'${t.task_id}')" ondragend="dragEnd(event)" onclick="detail('${t.task_id}')"><div class="token">${esc(t.token)} · ${esc(t.task_type)}</div><h3>${esc(t.title)}</h3><div class="desc">${esc((t.description||'').slice(0,120))}</div><div class="tags"><span class="tag">${esc(t.state)}</span><span class="tag">${esc(dest)}</span>${t.location?`<span class="tag">${esc(t.location)}</span>`:''}</div><div class="task-bottom"><div class="owner">${esc(t.owner||t.created_by||'–')} · ${age(t.updated_at)}</div><div class="priority">P${esc(t.priority)}</div></div></article>`}
function drag(e,id){dragId=id;e.currentTarget.classList.add('drag');e.dataTransfer.effectAllowed='move'}function dragEnd(e){e.currentTarget.classList.remove('drag');document.querySelectorAll('.lane').forEach(x=>x.classList.remove('over'))}function over(e){e.preventDefault();e.currentTarget.classList.add('over')}async function drop(e,lane){e.preventDefault();document.querySelectorAll('.lane').forEach(x=>x.classList.remove('over'));let t=D.tasks.find(x=>x.task_id===dragId);if(!t)return;let a=null;if(lane==='open')a='reopen';else if(lane==='assigned'){if(t.state==='open')return assignOpen(t);if(t.state==='assigned'||t.state==='accepted')return;toast('Zuweisung nur aus Eingang/zugewiesen möglich',true);return}else if(lane==='in_progress')a='start';else if(lane==='blocked')a='block';else if(lane==='completed')a='complete';if(a)await actionNow(t.task_id,a,{note:'Kanban drag/drop'})}
function modal(t,b){$('#mt').textContent=t;$('#mb').innerHTML=b;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}function taskAction(id,a){let t=D.tasks.find(x=>x.task_id===id);if(a==='comment')return commentOpen(t);if(a==='notify')return actionNow(id,a,{});if(a==='cancel')return confirmOpen(t,a);return actionNow(id,a,{note:'WebUI'})}async function actionNow(id,a,p={}){p.actor=actor;try{await api(`/api/v1/tasks/${id}/${a}`,{method:'POST',body:JSON.stringify(p)});toast(ACT[a]+' ausgeführt');closeModal();refresh()}catch(e){toast(e.message,true)}}function confirmOpen(t,a){modal(`${ACT[a]} · ${t.token}`,`<div class="field"><label>Notiz</label><textarea id="cn" placeholder="Begründung"></textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Zurück</button><button class="btn red" onclick="actionNow('${t.task_id}','${a}',{note:$('#cn').value})">${ACT[a]}</button></div>`)}
function assignOpen(t){modal(`Zuweisen · ${t.token}`,`<div class="form"><div class="field"><label>Ziel ISSI</label><input id="ai" type="number"></div><div class="field"><label>Ziel GSSI</label><input id="ag" type="number"></div><div class="field wide"><label>Owner</label><input id="ao" value="${esc(actor)}"></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Zurück</button><button class="btn primary" onclick="assignGo('${t.task_id}')">Zuweisen</button></div>`)}function assignGo(id){actionNow(id,'assign',{assigned_issi:+$('#ai').value||null,assigned_gssi:+$('#ag').value||null,owner:$('#ao').value,note:'Zuweisung WebUI'})}function commentOpen(t){modal(`Kommentar · ${t.token}`,`<div class="field"><label>Kommentar</label><textarea id="co"></textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Zurück</button><button class="btn primary" onclick="actionNow('${t.task_id}','comment',{note:$('#co').value})">Speichern</button></div>`)}
function detail(id){let t=D.tasks.find(x=>x.task_id===id),tl=[...(t.timeline||[])].reverse(),ns=[...(t.notifications||[])].reverse();modal(`${t.token} · ${t.title}`,`<div class="kpis">${[['Status',t.state],['Priorität','P'+t.priority],['ISSI',t.assigned_issi||'–'],['GSSI',t.assigned_gssi||'–'],['Owner',t.owner||'–'],['Ort',t.location||'–']].map(x=>`<div class="kpi"><span>${esc(x[0])}</span><b style="font-size:14px;margin-top:4px">${esc(x[1])}</b></div>`).join('')}</div><div class="actions" style="margin-top:12px">${actions(t).map(a=>`<button class="btn" onclick="taskAction('${t.task_id}','${a}')">${ACT[a]}</button>`).join('')}<button class="btn" onclick="taskAction('${t.task_id}','comment')">Kommentar</button></div><h3>Timeline</h3><div class="timeline">${tl.map(x=>`<div><b>${esc(x.action)} · ${esc(x.actor)}</b><span>${new Date(x.timestamp).toLocaleString()} ${x.note?'· '+esc(x.note):''}</span></div>`).join('')||'<span class="muted">Keine Einträge.</span>'}</div><h3>SDS / Benachrichtigungen</h3><div class="timeline">${ns.slice(0,12).map(x=>`<div><b>${esc(x.status||'notification')}</b><span>${esc(x.sds_state||'')} ${esc(x.destination||'')}</span></div>`).join('')||'<span class="muted">Keine Benachrichtigungen.</span>'}</div>`)}
function createOpen(){let o=D.templates.map(t=>`<option value="${esc(t.id)}">${esc(t.name||t.id)}</option>`).join('');modal('Neuen Auftrag anlegen',`<div class="form"><div class="field"><label>Vorlage</label><select id="tpl" onchange="templateFields()">${o}</select></div><div class="field"><label>Priorität</label><input id="pri" type="number" min="0" max="15" value="5"></div><div class="field wide"><label>Titel</label><input id="title"></div><div class="field"><label>Ziel ISSI</label><input id="issi" type="number"></div><div class="field"><label>Ziel GSSI</label><input id="gssi" type="number"></div><div class="field wide"><label>Beschreibung</label><textarea id="desc"></textarea></div><div id="tf" class="field wide"></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="createGo()">Anlegen</button></div>`);templateFields()}function templateFields(){let t=D.templates.find(x=>x.id===$('#tpl')?.value);if(!t||!$('#tf'))return;$('#tf').innerHTML=(t.fields||[]).map(f=>`<div class="field" style="margin-top:7px"><label>${esc(f.label||f.id)}${f.required?' *':''}</label><input data-f="${esc(f.id)}" ${f.required?'required':''}></div>`).join('')}async function createGo(){let fd={};document.querySelectorAll('[data-f]').forEach(x=>fd[x.dataset.f]=x.value);let p={template_id:$('#tpl').value,title:$('#title').value||undefined,priority:+$('#pri').value,assigned_issi:+$('#issi').value||null,assigned_gssi:+$('#gssi').value||null,description:$('#desc').value,form_data:fd,actor,notify:true};try{let t=await api('/api/v1/tasks',{method:'POST',body:JSON.stringify(p)});closeModal();toast('Auftrag '+t.token+' angelegt');refresh()}catch(e){toast(e.message,true)}}
async function refresh(silent=true){if(busy)return;busy=true;try{let [status,tasks,templates]=await Promise.all([api('/api/v1/status'),api('/api/v1/tasks?limit=800'),D.templates.length?Promise.resolve(D.templates):api('/api/v1/templates')]);D={...D,status,tasks,templates};renderStatus();renderFilters();render()}catch(e){if(!silent)toast(e.message,true)}finally{busy=false}}function toast(t,b=false){let e=document.createElement('div');e.className='toast'+(b?' bad':'');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})},500);refresh(false);setInterval(()=>refresh(true),4000);document.addEventListener('keydown',e=>e.key==='Escape'&&closeModal());
</script></body></html>
