# Was: Öffnet den Konfigurationsabschnitt `services`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[[services]]
# Was: Legt den technischen Namen des Pakets oder Dienstes fest.
# Warum: Build-Werkzeuge und andere Komponenten können es dadurch eindeutig ansprechen.
name = "media-library"
# Was: Setzt die Einstellung `display_name` für services.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
display_name = "Media Library"
# Was: Setzt die Einstellung `kind` für services.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
kind = "media"
# Was: Setzt die Einstellung `base_url` für services.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
base_url = "http://10.0.20.24:8230"
# Was: Setzt die Einstellung `critical` für services.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
critical = false

# Was: Öffnet den Konfigurationsabschnitt `directory`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[directory]
# Was: Setzt die Einstellung `hide_infrastructure` für directory.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
hide_infrastructure = true

[[services]]
name = "iot-gateway"
display_name = "IoT Gateway / MQTT"
kind = "integration"
base_url = "http://10.0.20.27:8240"
critical = false
