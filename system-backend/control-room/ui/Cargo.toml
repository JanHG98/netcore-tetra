# NETCORE-KOMMENTAR – Was: Enthält einen Teil der Logik für Leitstellenfunktionen und Bedienoberflächen.
# NETCORE-KOMMENTAR – Warum: Die Trennung in eine eigene Datei macht Zuständigkeit, Wartung und Fehlersuche übersichtlicher.

# Was: Öffnet den Konfigurationsabschnitt `package`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[package]
# Was: Legt den technischen Namen des Pakets oder Dienstes fest.
# Warum: Build-Werkzeuge und andere Komponenten können es dadurch eindeutig ansprechen.
name = "netcore-control-room-ui"
# Was: Legt die Versionsnummer fest.
# Warum: Änderungsstände und kompatible Abhängigkeiten bleiben dadurch nachvollziehbar.
version = "1.3.0"
# Was: Wählt die verwendete Rust-Sprachversion.
# Warum: Compiler und Entwickler verwenden dadurch dieselben Sprachregeln.
edition = "2021"
# Was: Beschreibt kurz den Zweck der Komponente.
# Warum: Menschen und Paketwerkzeuge können die Aufgabe dadurch ohne Quellcodeanalyse erkennen.
description = "Native desktop UI for NetCore Control Room"

# This crate intentionally builds standalone with --manifest-path so the
# Control Room UI can be built on operator workstations without changing the
# FlowStation workspace membership.
# Was: Öffnet den Konfigurationsabschnitt `workspace`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[workspace]

# Was: Öffnet den Konfigurationsabschnitt `dependencies`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[dependencies]
# Was: Bindet die Abhängigkeit `eframe` in dieses Rust-Paket ein.
# Warum: Die Bibliothek stellt benötigte Funktionen bereit, sodass sie nicht fehleranfällig selbst nachgebaut werden müssen.
eframe = { version = "0.27", default-features = true }
# Was: Bindet die Abhängigkeit `egui_extras` in dieses Rust-Paket ein.
# Warum: Die Bibliothek stellt benötigte Funktionen bereit, sodass sie nicht fehleranfällig selbst nachgebaut werden müssen.
egui_extras = { version = "0.27", default-features = false }
# Was: Bindet die Abhängigkeit `reqwest` in dieses Rust-Paket ein.
# Warum: Die Bibliothek stellt benötigte Funktionen bereit, sodass sie nicht fehleranfällig selbst nachgebaut werden müssen.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Was: Bindet die Abhängigkeit `serde` in dieses Rust-Paket ein.
# Warum: Die Bibliothek stellt benötigte Funktionen bereit, sodass sie nicht fehleranfällig selbst nachgebaut werden müssen.
serde = { version = "1", features = ["derive"] }
# Was: Bindet die Abhängigkeit `serde_json` in dieses Rust-Paket ein.
# Warum: Die Bibliothek stellt benötigte Funktionen bereit, sodass sie nicht fehleranfällig selbst nachgebaut werden müssen.
serde_json = "1"
# Was: Bindet die Abhängigkeit `toml` in dieses Rust-Paket ein.
# Warum: Die Bibliothek stellt benötigte Funktionen bereit, sodass sie nicht fehleranfällig selbst nachgebaut werden müssen.
toml = "0.8"
# Was: Bindet die Abhängigkeit `dirs-next` in dieses Rust-Paket ein.
# Warum: Die Bibliothek stellt benötigte Funktionen bereit, sodass sie nicht fehleranfällig selbst nachgebaut werden müssen.
dirs-next = "2"
# Was: Bindet die Abhängigkeit `image` in dieses Rust-Paket ein.
# Warum: Die Bibliothek stellt benötigte Funktionen bereit, sodass sie nicht fehleranfällig selbst nachgebaut werden müssen.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
