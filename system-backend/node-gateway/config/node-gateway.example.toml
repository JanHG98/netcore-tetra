[server]
# Open lab listener. Put this LXC only into an isolated management/test VLAN.
bind = "0.0.0.0:8080"
node_path = "/ws/node"
backend_path = "/ws/backend"
history_limit = 1000
stale_after_secs = 20
hello_timeout_secs = 10
application_ping_secs = 15

[security]
# This package deliberately supports only open_lab.
# No token fields exist and no user/password login is performed.
mode = "open_lab"
allow_remote_management = true

[limits]
max_message_bytes = 1048576
max_http_body_bytes = 1048576

[service_monitor]
# Health is evaluated by service, not by Internet reachability. The TBS receives
# this matrix over its existing Node Gateway WebSocket and chooses central or
# local authority per feature.
enabled = true
interval_secs = 5
timeout_ms = 1500
failure_threshold = 2
recovery_threshold = 2

[[service_monitor.targets]]
name = "mobility-core"
url = "http://10.0.20.11:8090/health/ready"
critical_for_edge = true
fallback_mode = "local_registration_and_location_area"

[[service_monitor.targets]]
