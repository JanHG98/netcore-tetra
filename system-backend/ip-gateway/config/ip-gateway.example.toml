allow_established = true
# Im isolierten Labor standardmäßig freie Fahrt nach außen; vor Produktivbetrieb einschränken.
# Was: Setzt die Einstellung `allow_general_internet` für firewall.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
allow_general_internet = true
# Was: Setzt die Einstellung `allow_icmp` für firewall.
