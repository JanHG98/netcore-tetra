# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
enabled = true
# Nur am Packet-Data-Gateway binden; 0.0.0.0 wird zur Laufzeit ebenfalls
# automatisch auf diese TUN-Adresse eingegrenzt.
# Was: Setzt die Einstellung `bind` für dns.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
bind = "10.0.0.1:53"
# Was: Setzt die Einstellung `upstream` für dns.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
upstream = "1.1.1.1:53"
# Was: Setzt die Einstellung `local_domain` für dns.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
local_domain = "netcore.test"
# Was: Setzt die Einstellung `ttl_secs` für dns.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
ttl_secs = 30
# Was: Setzt die Einstellung `query_timeout_ms` für dns.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
query_timeout_ms = 2000

