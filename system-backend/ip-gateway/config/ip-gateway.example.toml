# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
url = "http://127.0.0.1:8160"
# Was: Setzt die Einstellung `poll_interval_ms` für Datenpaket core.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
poll_interval_ms = 250
# Was: Setzt die Einstellung `context_refresh_ms` für Datenpaket core.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
context_refresh_ms = 1000
# Was: Setzt die Einstellung `request_timeout_ms` für Datenpaket core.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
request_timeout_ms = 2000
# Was: Setzt die Einstellung `outbox_batch` für Datenpaket core.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
outbox_batch = 250

# Was: Öffnet den Konfigurationsabschnitt `storage`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[storage]
# Was: Setzt die Einstellung `database_path` für storage.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
database_path = "/var/lib/netcore-ip-gateway/state.json"
# Was: Setzt die Einstellung `backup_path` für storage.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
backup_path = "/var/lib/netcore-ip-gateway/state.json.bak"

# Was: Öffnet den Konfigurationsabschnitt `interface`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[interface]
# shadow: Packet Core, Regeln und Kernel-Plan beobachten, aber kein TUN öffnen.
# authoritative: /dev/net/tun öffnen, IP-Pakete transportieren und Kernelregeln anwenden.
# Was: Setzt die Einstellung `mode` für interface.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
mode = "shadow"
# Was: Legt den technischen Namen des Pakets oder Dienstes fest.
# Warum: Build-Werkzeuge und andere Komponenten können es dadurch eindeutig ansprechen.
name = "ntc-tun0"
# Was: Setzt die Einstellung `address` für interface.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
address = "10.0.0.1/24"
# Was: Setzt die Einstellung `network` für interface.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
network = "10.0.0.0/24"
# Was: Setzt die Einstellung `mtu` für interface.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
mtu = 480
# Was: Setzt die Einstellung `owner_user` für interface.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
owner_user = "netcore"
# Was: Setzt die Einstellung `delete_on_exit` für interface.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
delete_on_exit = true

