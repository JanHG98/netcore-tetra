<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetCore Hardware-Gateway</title>
<style>
body{margin:0;background:var(--nc-bg,#f3f6fb);color:var(--nc-text,#0b1832);font-family:system-ui,sans-serif}.wrap{max-width:1600px;margin:auto;padding:24px}h1{margin:8px 0;font-size:clamp(26px,3vw,42px)}h2{margin:0 0 18px}.muted{color:var(--nc-muted,#425779)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0}.card,.panel{background:var(--nc-panel,#fff);border:1px solid var(--nc-border,#dce7f5);border-radius:12px;padding:20px}.card-label{color:var(--nc-muted,#425779)}.value{font-size:clamp(20px,2vw,30px);font-weight:750;margin:6px 0;overflow-wrap:anywhere}.small{font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{color:var(--nc-muted,#425779);font-weight:600}td,th{padding:16px 12px;border-bottom:1px solid var(--nc-border,#e3ebf6);vertical-align:middle}td:first-child,th:first-child{padding-left:0}tr:last-child td{border-bottom:0}.ok{color:var(--nc-ok,#129c57)}.bad,.critical{color:var(--nc-error,#d9323d)}.warning{color:var(--nc-warn,#c57a00)}.pill{display:inline-block;font-size:13px;padding:4px 9px;border-radius:20px;background:var(--nc-panel-2,#edf3fb)}.metrics{display:flex;gap:24px;flex-wrap:wrap}.hw-metric{min-width:85px;border-left:1px solid var(--nc-border,#dce7f5);padding-left:12px}.hw-metric dt{color:var(--nc-muted,#425779);font-size:12px}.hw-metric dd{margin:4px 0 0;font-size:17px}.alarm{margin:5px 0}details{margin-top:8px}summary{cursor:pointer;color:var(--nc-muted,#425779);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--nc-bg,#f3f6fb);padding:12px;border-radius:6px}code{font-size:12px;color:var(--nc-muted,#425779)}.refresh-state{min-height:20px;font-size:13px;margin:12px 0}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--nc-muted,#425779)}.empty{text-align:center;padding:28px;color:var(--nc-muted,#425779)}@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:16px}table{min-width:850px}}@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style><style>
html[data-netcore-ui] .hw-service .hw-metric{font-size:14px;font-weight:400;letter-spacing:normal}
html[data-netcore-ui] :is(.hw-service,.rf-service) h1{font-size:clamp(26px,3vw,40px)}
html[data-netcore-ui] .hw-service .alarm{background:transparent;padding:0}
html[data-netcore-ui] :is(.hw-service,.rf-service) .critical{color:var(--nc-error)}
html[data-netcore-ui] :is(.hw-service,.rf-service) .warning{color:var(--nc-warn)}
html[data-netcore-ui] .hw-service .alarm.warning{color:var(--nc-warn)}
html[data-netcore-ui] :is(.hw-service,.rf-service) .selected-row{background:var(--nc-panel-2)}
html[data-netcore-ui] :is(.hw-service,.rf-service) :is(.eyebrow,.spectrum-label,.hw-metric dt,.telemetry-values dt,summary,code,.station-note){color:var(--nc-muted)}
</style></head><body><main class="wrap hw-service" id="overview"><nav><a href="#overview" aria-current="true">Übersicht</a><a href="#devices">Geräte</a></nav>
<div class="eyebrow">HARDWARE-GATEWAY</div><h1>Rack- und Umgebungsüberwachung</h1><p class="muted">Überwachung von Hardware, Racks und Umweltsensoren</p>
<div class="cards" id="s" aria-live="polite"><div class="card muted">Status wird geladen …</div></div>
<p id="refresh-state" class="refresh-state muted" role="status">Verbindung wird aufgebaut …</p>
<section class="panel" id="devices"><h2>Geräte</h2><div class="table-wrap"><table><thead><tr><th>Gerät / ID</th><th>Status</th><th>Letztes Signal</th><th>Messwerte</th><th>Alarme</th></tr></thead><tbody id="d"><tr><td class="empty" colspan="5">Geräte werden geladen …</td></tr></tbody></table></div></section>
</main><script>
const hwEscape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hwNumber=(v,d=1)=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:d}):'—';
const hwMetricInfo={temperature_c:['Temperatur','°C'],humidity_percent:['Feuchte','%'],supply_voltage_v:['Versorgung','V']};
function hwTimestamp(value){const date=new Date(value);if(!value||!Number.isFinite(date.getTime()))return '—';const seconds=Math.max(0,Math.floor((Date.now()-date.getTime())/1000));const text=seconds<60?`vor ${seconds} s`:seconds<3600?`vor ${Math.floor(seconds/60)} min`:seconds<86400?`vor ${Math.floor(seconds/3600)} h`:date.toLocaleString('de-DE');return `<time datetime="${hwEscape(value)}" title="${hwEscape(date.toLocaleString('de-DE'))}">${hwEscape(text)}</time>`;}
function hwValue(value,key){if(value==null)return '—';const unit=hwMetricInfo[key]?.[1]||'';if(typeof value==='number')return `${hwNumber(value)}${Number.isFinite(value)&&unit?' '+unit:''}`;return hwEscape(typeof value==='object'?JSON.stringify(value):value??'—');}
function hwMetrics(values){const entries=Object.entries(values||{});return entries.length?`<dl class="metrics">${entries.map(([key,value])=>`<div class="hw-metric"><dt>${hwEscape(hwMetricInfo[key]?.[0]||key)}</dt><dd>${hwValue(value,key)}</dd></div>`).join('')}</dl>`:'<span class="muted">Keine Messwerte</span>';}
function hwAlarms(alarms){if(!Array.isArray(alarms)||!alarms.length)return '<span class="muted">—<br><span class="small">Keine Alarme</span></span>';return alarms.map(a=>{const severity=a.severity==='critical'?'critical':'warning';const reason={warning_above:'Warnschwelle überschritten',critical_above:'Kritische Schwelle überschritten',warning_below:'Warnschwelle unterschritten',critical_below:'Kritische Schwelle unterschritten'}[a.reason]||a.reason||'Grenzwertalarm';return `<div class="alarm ${severity}"><b>${hwEscape(hwMetricInfo[a.metric]?.[0]||a.metric)}</b><br><span class="small">${hwValue(a.value,a.metric)} · ${hwEscape(reason)}</span></div>`}).join('');}
async function hwGet(path){const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json();}
async function r(){try{const [s,ds]=await Promise.all([hwGet('/api/v1/status'),hwGet('/api/v1/devices')]);document.querySelector('#s').innerHTML=[['Geräte online',`${s.devices_online} / ${s.devices_total}`,'Aktive Geräte im Netzwerk'],['MQTT',`${s.mqtt_host}:${s.mqtt_port}`,'Konfigurierte Broker-Adresse'],['Phase',s.phase,'Aktive Systemphase'],['Ausgänge',s.outputs_enabled?'aktiviert':'deaktiviert',s.outputs_enabled?'Ausgänge laut Konfiguration aktiviert':'Hardware-Ausgänge sind deaktiviert']].map(([label,value,detail])=>`<div class="card"><div class="card-label">${hwEscape(label)}</div><div class="value">${hwEscape(value)}</div><div class="small muted">${hwEscape(detail)}</div></div>`).join('');document.querySelector('#d').innerHTML=ds.map(x=>`<tr><td><b>${hwEscape(x.name||x.device_id)}</b><br><code>${hwEscape(x.device_id)}</code><details><summary>Gerätedaten</summary><pre>${hwEscape(JSON.stringify({kind:x.kind,location:x.location,firmware:x.firmware,source:x.source,inputs:x.inputs,outputs:x.outputs},null,2))}</pre></details></td><td class="${x.online?'ok':'bad'}"><span class="pill ${x.online?'ok':'bad'}">● ${x.online?'Online':'Offline'}</span></td><td>${hwTimestamp(x.last_seen)}</td><td>${hwMetrics(x.metrics)}</td><td>${hwAlarms(x.alarms)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Noch keine Geräte registriert. Telemetrie wird über HTTP oder MQTT empfangen.</td></tr>';document.querySelector('#refresh-state').textContent=`Aktualisiert ${new Date().toLocaleTimeString('de-DE')} · Nur Überwachung`;document.querySelector('#refresh-state').className='refresh-state muted';}catch(error){document.querySelector('#refresh-state').textContent=`Aktualisierung fehlgeschlagen: ${error.message}. Vorhandene Daten können veraltet sein.`;document.querySelector('#refresh-state').className='refresh-state bad';}}
r();setInterval(r,3000);
</script></body></html>
