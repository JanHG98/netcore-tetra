<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetCore · Alarm Ops</title><style>
:root{color-scheme:dark;--bg:#050a10;--p:#0b1722e8;--p2:#0f2130;--l:#244052;--t:#edf9ff;--m:#86a4b6;--c:#42dcff;--g:#50e59a;--y:#ffc857;--r:#ff5964;--o:#ff9857}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% -5%,#12374b88,transparent 30%),radial-gradient(circle at 90% 0,#4a131b55,transparent 25%),linear-gradient(145deg,#050a10,#08141e);color:var(--t);font-family:Inter,system-ui,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#54d8ff0d 1px,transparent 1px),linear-gradient(90deg,#54d8ff0d 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(#000,transparent 90%)}body:after{content:"";position:fixed;left:0;right:0;top:-20vh;height:16vh;background:linear-gradient(transparent,#42dcff0c,transparent);animation:scan 9s linear infinite;pointer-events:none}@keyframes scan{to{transform:translateY(140vh)}}@keyframes in{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 0 10px #ff596411,0 0 36px #ff596425}}@keyframes spin{to{transform:rotate(360deg)}}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:13px;padding:13px 20px;background:#050b12df;border-bottom:1px solid #244052aa;backdrop-filter:blur(16px)}.logo{width:34px;height:34px;border:1px solid #42dcff88;border-radius:50%;position:relative}.logo:before,.logo:after{content:"";position:absolute;border-radius:50%;inset:7px;border:1px solid #42dcff66}.logo:after{inset:13px;background:var(--c);border:0;box-shadow:0 0 14px var(--c)}.brand b{font-size:13px;letter-spacing:.15em}.brand div{font-size:9px;color:var(--m);letter-spacing:.12em}.health{display:flex;gap:7px;margin-left:auto}.pill{font-size:10px;color:var(--m);border:1px solid var(--l);background:#10212dbc;padding:6px 9px;border-radius:999px}.pill.ok{color:#91f6bd;border-color:#50e59a55}.pill.bad{color:#ff9197;borde ,.55fr);gap:14px;margin-top:14px;align-items:start}.board,.side{padding:16px}.side{position:sticky;top:75px}.head{display:flex;align-items:center;gap:8px;margin-bottom:11px}.head h2{font-size:16px;margin:0}.count{font-size:10px;color:var(--c);border:1px solid #42dcff33;background:#42dcff12;border-radius:999px;padding:3px 6px}.spacer{flex:1}.search{width:min(300px,100%);background:#06131c;border:1px solid var(--l);color:var(--t);border-radius:9px;padding:8px 10px}.filters{display:flex;gap:6px;flex-wrap:wrap}.chip{cursor:pointer;font-size:10px;color:var(--m);background:#0a1b27;border:1px solid var(--l);padding:6px 8px;border-radius:999px}.chip.on{color:var(--t);border-color:#42dcff77;background:#42dcff13}.list{display:grid;gap:9px}.alarm{--s:var(--y);position:relative;padding:14px 15px 12px 17px;background:linear-gradient(105deg,color-mix(in srgb,var(--s) 7%,#0b1c28),#091721 45%);border:1px solid color-mix(in srgb,var(--s) 28%,#244052);border-radius:14px}.alarm.fresh{animation:in .25s ease both}.alarm:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--s);box-shadow:0 0 16px var(--s)}.alarm.hot{animation:pulse 2.5s ease-in-out infinite}.alarm.hot.fresh{animation:in .25s ease,pulse 2.5s ease-in-out infinite}.row{display:flex;gap:12px}.grow{flex:1;min-width:0}.token{font-size:9px;color:var(--s);font-weight:900;letter-spacing:.13em}.alarm h3{margin:2px 0 4px;font-size:15px}.desc,.muted{color:var(--m);font-size:10px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:9px;border:1px solid #ffffff12;background:#ffffff08;padding:3px 5px;border-radius:6px}.right{text-align:right;min-width:120px}.sev{font-size:9px;font-weight:900;color:var(--s);text-transform:uppercase}.occ{font-size:18px;font-weight:900;margin-top:4px}.deadline{color:var(--m);font-size:9px;margin-top:5px}.deadline b{display:block;color:var(--y);font-size:10px}.buttons{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.buttons .btn{font-size:9px;padding:5px 7px}.events{display:grid;gap:7px;max-height:650px;overflow:auto}.event{padding:8px 9px;border-left:2px solid #42dcff55;background:#07131d99;border-radius:0 8px 8px 0}.event.fresh{animation:in .2s}.event.hot{border-color:var(--r)}.event b{font-size:10px}.event div{font-size:9px;color:var(--m);margin-top:2px}.empty{padding:45px 15px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:13px}.modal{position:fixed;inset:0;z-index:30;background:#010407c9;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(7px)}.modal.open{display:flex}.box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0a1925;border:1px solid #315268;border-radius:16px;box-shadow:0 30px 90px #000a;padding:18px;animation:in .18s}.box h2{margin:0 0 14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.field input,.field select,.field textarea{width:100%;background:#06131c;color:var(--t);border:1px solid var(--l);border-radius:8px;padding:9px}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.timeline{display:grid;gap:7px}.timeline div{padding:8px;border-left:2px solid #42dcff55;background:#07131d}.timeline b{font-size:10px}.timeline span{display:block;color:var(--m);font-size:9px;margin-top:2px}.toast{position:fixed;right:18px;bottom:18px;z-index:40;background:#0e2735;border:1px solid #42dcff66;padding:10px 13px;border-radius:10px;box-shadow:0 18px 40px #0008;animation:in .2s}.toast.bad{border-color:#ff596477}.hide{display:none}@media(max-width:980px){.hero,.work{grid-template-columns:1fr}.side{position:static}.health{display:none}}@media(max-width:620px){main{padding:12px}.top{padding:10px 12px}.form{grid-template-columns:1fr}.field.wide{grid-column:auto}.alarm .right{min-width:80px}.actions{margin-left:0}}

</style></head><body><div class="top"><div class="logo"></div><div class="brand"><b>NETCORE · ALARM OPS</b><div>WORKFLOW COMMAND SURFACE</div></div><div class="health"><span id="mq" class="pill">MQTT</span><span id="sds" class="pill">SDS</span><span class="pill lab">OPEN LAB</span></div><div id="clock" class="clock"></div></div><main><div class="hero"><section class="panel command"><div><div class="eyebrow">LIVE INCIDENT CONTROL</div><h1 id="headline">Lage wird synchronisiert…</h1><p>Alarmierung, Quittierung, Übernahme und Eskalation direkt auf dem Workflow-Zustand.</p></div><div class="command-bottom"><div class="radar"></div><div class="level"><b id="level">Lage unbekannt</b><div id="levelSub">warte auf Workflow</div></div><div class="actions"><button class="btn" onclick="refresh(false)">↻ Sync</button><button class="btn primary" onclick="createOpen()">＋ Alarm</button></div></div></section><section class="panel stats"><h3>Live-Lage</h3><div id="kpis" class="grid"></div></section></div><div class="work"><section class="panel board"><div class="head"><h2>Alarmboard</h2><span id="alarmCount" class="count">0</span><div class="spacer"></div><input id="search" class="search" placeholder="Token, Titel, Quelle…" oninput="renderAlarms()"></div><div id="filters" class="filters"></div><div id="alarms" class="list" style="margin-top:10px"></div></section><aside class="panel side"><div class="head"><h2>Signal Stream</h2><span id="eventCount" class="count">0</span></div><div id="events" class="events"></div></aside></div></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><script>
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D={status:{},alarms:[],events:[],profiles:[]},filter='active',busy=false,seenAlarmIds=new Set(),seenEventIds=new Set(),actor=localStorage.getItem('nc_alarm_actor')||'webui-openlab';const ACTIVE=new Set(['open','acknowledged','assigned','in_progress']),SL={open:'OFFEN',acknowledged:'QUITT.',assigned:'ÜBERN.',in_progress:'IN ARBEIT',resolved:'GELÖST',closed:'GESCHL.',cancelled:'ABBRUCH'},AL={ack:'ACK',take:'Übernehmen',start:'Start',resolve:'Lösen',close:'Schließen',cancel:'Abbruch',reopen:'Wieder öffnen',escalate:'Eskalieren',notify:'SDS senden'};
async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),t=await r.text(),j=t?JSON.parse(t):{};if(!r.ok)throw Error(j.error||t||r.statusText);return j}function sev(s){return({emergency:'#ff5964',critical:'#ff5964',error:'#ff9857',warning:'#ffc857',notice:'#42dcff',info:'#50e59a',debug:'#86a4b6'})[s]||'#ffc857'}function ago(t){let s=Math.max(0,(Date.now()-new Date(t))/1000);return s<60?`${s|0}s`:s<3600?`${s/60|0}m`:s<86400?`${s/3600|0}h`:`${s/86400|0}d`}function cd(t){if(!t)return'gestoppt';let s=Math.ceil((new Date(t)-Date.now())/1000);if(s<=0)return'JETZT';let m=s/60|0;return m?`${m}m ${s%60}s`:`${s}s`}function stateActions(a){if(a.state==='open')return['ack','take','start','resolve','escalate','notify'];if(a.state==='acknowledged')return['take','start','resolve','notify'];if(a.state==='assigned')return['ack','start','resolve','notify'];if(a.state==='in_progress')return['ack','take','resolve','notify'];if(a.state==='resolved')return['close','reopen'];if(['closed','cancelled'].includes(a.state))return['reopen'];return[]}
function health(id,ok,text){let e=$(id);e.className='pill '+(ok?'ok':'bad');e.textContent=text}function renderStatus(){let s=D.status,active=D.alarms.filter(a=>ACTIVE.has(a.state)),crit=active.filter(a=>['critical','emergency'].includes(a.severity)),due=active.filter(a=>a.next_escalation_at&&new Date(a.next_escalation_at)-Date.now()<60000);health('#mq',s.mqtt_connected,'MQTT '+(s.mqtt_connected?'ONLINE':'OFFLINE'));health('#sds',s.sds_router_healthy,'SDS '+(s.sds_router_healthy?'ONLINE':'OFFLINE'));$('#kpis').innerHTML=[['Aktiv',active.length],['Kritisch',crit.length],['Eskalation <60s',due.length],['Regeln',s.rules||0]].map(x=>`<div class="kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');$('#headline').textContent=crit.length?(crit.length===1?'1 kritischer Alarm':`${crit.length} kritische Alarme`):active.length?(active.length===1?'1 aktiver Alarm':`${active.length} aktive Alarme`):'Kein aktiver Alarm';$('#level').textContent=crit.length?'KRITISCHE LAGE':active.length?'AKTIVE LAGE':'SYSTEM RUHIG';$('#levelSub').textContent=due.length?`${due.length} Eskalation(en) unmittelbar fällig`:'keine unmittelbare Eskalation'}
function renderFilters(){let opts=[['active','Aktiv'],['critical','Kritisch'],['open','Offen'],['resolved','Gelöst'],['all','Alle']];$('#filters').innerHTML=opts.map(x=>`<button class="chip ${filter===x[0]?'on':''}" onclick="filter='${x[0]}';renderFilters();renderAlarms()">${x[1]}</button>`).join('')}function renderAlarms(){let q=$('#search').value.toLowerCase(),a=D.alarms.filter(x=>{if(filter==='active'&&!ACTIVE.has(x.state))return false;if(filter==='critical'&&!['critical','emergency','error'].includes(x.severity))return false;if(!['active','critical','all'].includes(filter)&&x.state!==filter)return false;return !q||JSON.stringify([x.token,x.title,x.alarm_type,x.source?.service,x.subject?.id]).toLowerCase().includes(q)});$('#alarmCount').textContent=a.length;$('#alarms').innerHTML=a.length?a.map(x=>`<article class="alarm ${!seenAlarmIds.has(x.alarm_id)?'fresh ':''}${['critical','emergency'].includes(x.severity)&&ACTIVE.has(x.state)?'hot':''}" style="--s:${sev(x.severity)}" onclick="detail('${x.alarm_id}')"><div class="row"><div class="grow"><div class="token">${esc(x.token)} · ${esc(x.alarm_type)}</div><h3>${esc(x.title)}</h3><div class="desc">${esc(x.description||'')}</div><div class="meta"><span class="tag">${esc(SL[x.state]||x.state)}</span><span class="tag">P${esc(x.priority)}</span><span class="tag">${esc(x.source?.service||'manual')}</span><span class="tag">${esc(x.subject?.id||'–')}</span></div></div><div class="right"><div class="sev">${esc(x.severity)}</div><div class="occ">${esc(x.occurrences||1)}×</div><div class="deadline">Eskalation<b>${esc(cd(x.next_escalation_at))}</b></div></div></div><div class="buttons" onclick="event.stopPropagation()">${stateActions(x).slice(0,5).map(k=>`<button class="btn" onclick="act('${x.alarm_id}','${k}')">${AL[k]}</button>`).join('')}</div></article>`).join(''):'<div class="empty">Keine Alarme im aktuellen Filter. Der Radar darf auch mal arbeitslos sein. 😄</div>';a.forEach(x=>seenAlarmIds.add(x.alarm_id))}
function renderEvents(){let e=[...D.events].sort((a,b)=>String(b.timestamp).localeCompare(String(a.timestamp))).slice(0,60),key=x=>x.event_id||`${x.timestamp}|${x.event_type}|${x.subject?.id||''}`;$('#eventCount').textContent=e.length;$('#events').innerHTML=e.map(x=>`<div class="event ${!seenEventIds.has(key(x))?'fresh ':''}${['error','critical','emergency'].includes(x.severity)||String(x.event_type).includes('escalat')?'hot':''}"><b>${esc(x.event_type)}</b><div>${esc(x.subject?.id||'')} · ${ago(x.timestamp)} · ${esc(x.source?.service||'')}</div></div>`).join('')||'<div class="muted">Noch keine Ereignisse.</div>';e.forEach(x=>seenEventIds.add(key(x)))}
async function refresh(silent=true){if(busy)return;busy=true;try{let [status,alarms,events,profiles]=await Promise.all([api('/api/v1/status'),api('/api/v1/alarms?limit=700'),api('/api/v1/events?limit=100'),D.profiles.length?Promise.resolve(D.profiles):api('/api/v1/escalation-profiles')]);D={status,alarms,events,profiles};renderStatus();renderFilters();renderAlarms();renderEvents()}catch(e){if(!silent)toast(e.message,true)}finally{busy=false}}
function modal(t,b){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}function act(id,a){let x=D.alarms.find(v=>v.alarm_id===id);modal(`${AL[a]} · ${x?.token||''}`,`<div class="field"><label>Audit-Akteur</label><input id="ma" value="${esc(actor)}"></div><div class="field" style="margin-top:10px"><label>Notiz</label><textarea id="mn" placeholder="Lagehinweis / Begründung"></textarea></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Zurück</button><button class="btn ${['cancel','close'].includes(a)?'red':'primary'}" onclick="commit('${id}','${a}')">${AL[a]}</button></div>`)}async function commit(id,a){actor=$('#ma').value.trim()||'webui-openlab';localStorage.setItem('nc_alarm_actor',actor);try{await api(`/api/v1/alarms/${id}/${a}`,{method:'POST',body:JSON.stringify({actor,note:$('#mn').value})});closeModal();toast(AL[a]+' ausgeführt');refresh()}catch(e){toast(e.message,true)}}
function detail(id){let a=D.alarms.find(x=>x.alarm_id===id),h=[...(a.history||[])].reverse();modal(`${a.token} · ${a.title}`,`<div class="grid">${[['Status',SL[a.state]||a.state],['Severity',a.severity],['Priorität','P'+a.priority],['Vorkommen',a.occurrences],['Zugewiesen',a.assigned_to||'–'],['ACK',a.acknowledged_by||'–']].map(x=>`<div class="kpi"><span>${esc(x[0])}</span><b style="font-size:15px;margin-top:4px">${esc(x[1])}</b></div>`).join('')}</div><h3>Verlauf</h3><div class="timeline">${h.map(x=>`<div><b>${esc(x.action)} · ${esc(x.actor)}</b><span>${new Date(x.timestamp).toLocaleString()} ${x.detail?.note?'· '+esc(x.detail.note):''}</span></div>`).join('')||'<span class="muted">Kein Verlauf</span>'}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Schließen</button></div>`)}
function createOpen(){let p=D.profiles.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.id)}</option>`).join('');modal('Manuellen Alarm auslösen',`<div class="form"><div class="field wide"><label>Titel</label><input id="ct" placeholder="z. B. TBS-01 Uplink gestört"></div><div class="field"><label>Severity</label><select id="cs"><option>warning</option><option>error</option><option>critical</option><option>emergency</option><option>notice</option></select></div><div class="field"><label>Priorität</label><input id="cp" type="number" min="0" max="15" value="7"></div><div class="field"><label>Alarmtyp</label><input id="cy" value="manual"></div><div class="field"><label>Subject</label><input id="ci" value="manual"></div><div class="field wide"><label>Beschreibung</label><textarea id="cd"></textarea></div><div class="field wide"><label>Eskalationsprofil</label><select id="ce">${p}</select></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="createAlarm()">Alarm auslösen</button></div>`)}async function createAlarm(){try{let x=await api('/api/v1/alarms',{method:'POST',body:JSON.stringify({title:$('#ct').value||'Manual alarm',description:$('#cd').value,severity:$('#cs').value,priority:+$('#cp').value,alarm_type:$('#cy').value,subject_id:$('#ci').value,escalation_profile:$('#ce').value,requires_ack:true})});closeModal();toast('Alarm '+x.token+' angelegt');refresh()}catch(e){toast(e.message,true)}}
function toast(t,b=false){let e=document.createElement('div');e.className='toast'+(b?' bad':'');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}setInterval(()=>{$('#clock').innerHTML=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})},500);refresh(false);setInterval(()=>refresh(true),3000);setInterval(()=>document.querySelectorAll('[data-deadline]').forEach(()=>{}),1000);document.addEventListener('keydown',e=>e.key==='Escape'&&closeModal());
</script></body></html>
