# Phase 3 MQTT-/IoT-Brücke. OPEN LAB, keine Credentials und kein TLS.
[[services]]
name = "iot-gateway"
webui = true
scheme = "http"
management_port = 8240
security_mode = "open_lab"
token_auth = false
tls = false
depends_on = ["node-gateway", "mobility-core", "call-control", "sds-router"]
warning = "OPEN LAB: no login, no tokens, no MQTT credentials and no TLS; commands are observed but never executed in Phase 3"


# Phase 6 Hardware-I/O und Racküberwachung. OPEN LAB, reine Telemetrie; Ausgänge deaktiviert.
[[services]]
name = "hardware-gateway"
webui = true
scheme = "http"
management_port = 8250
security_mode = "open_lab"
token_auth = false
tls = false
depends_on = ["iot-gateway"]
warning = "OPEN LAB: no login, tokens or TLS; telemetry may be injected by every reachable client; physical outputs remain disabled"

# Phase 7 zentrale RF-/PA-/Antennenüberwachung. OPEN LAB, reine Überwachung.
[[services]]
