webui = true
scheme = "http"
management_port = 8260
security_mode = "open_lab"
token_auth = false
tls = false
depends_on = ["iot-gateway"]
warning = "OPEN LAB: no login, tokens or TLS; every reachable client may inject RF telemetry; no transmitter control is implemented"


