# Dedicated receiver. Do not include /etc/rsyslog.conf here (no local feedback).
global(workDirectory="/var/lib/netcore-observability/logs/queue" maxMessageSize="32k")
module(load="imtcp")
module(load="imudp")
module(load="imrelp")
module(load="omprog")

# Bounded persistent input queue; RELP is recommended, UDP can lose messages.
main_queue(queue.type="Disk" queue.filename="receiver" queue.maxDiskSpace="128m"
  queue.maxFileSize="8m" queue.checkpointInterval="1" queue.syncQueueFiles="on"
  queue.workerThreads="1" queue.timeoutEnqueue="0" queue.saveOnShutdown="on")

template(name="NetCoreJSON" type="list" option.jsonf="on") {
  property(outname="timestamp" name="timereported" dateFormat="rfc3339" format="jsonf")
  property(outname="hostname" name="hostname" format="jsonf")
  property(outname="source_ip" name="fromhost-ip" format="jsonf")
  property(outname="program" name="programname" format="jsonf")
  property(outname="severity" name="syslogseverity-text" format="jsonf")
  property(outname="facility" name="syslogfacility-text" format="jsonf")
  property(outname="transport" name="inputname" format="jsonf")
  property(outname="message" name="msg" format="jsonf")
}

action(type="omprog" binary="/usr/bin/python3 /opt/netcore-observability/logging/log_store.py ingest --config /etc/netcore/syslog.json"
  template="NetCoreJSON" confirmMessages="on" useTransactions="off"
  action.resumeRetryCount="-1" action.resumeInterval="5"
  forceSingleInstance="on" signalOnClose="on" closeTimeout="5000")

input(type="imtcp" address="0.0.0.0" port="514")
input(type="imudp" address="0.0.0.0" port="514")
input(type="imrelp" address="0.0.0.0" port="20514")
