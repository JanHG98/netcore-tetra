  # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
  alertmanagers:
    # Was: Legt den YAML-Bereich oder Wert `static_configs` fest.
    # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
    - static_configs:
        # Was: Legt den YAML-Bereich oder Wert `targets` fest.
        # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
        - targets: ["127.0.0.1:9093"]
# Was: Legt den YAML-Bereich oder Wert `scrape_configs` fest.
# Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
scrape_configs:
  # Was: Legt den YAML-Bereich oder Wert `job_name` fest.
  # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
  - job_name: netcore-observability
    # Was: Legt den YAML-Bereich oder Wert `static_configs` fest.
    # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
    static_configs:
      # Was: Legt den YAML-Bereich oder Wert `targets` fest.
      # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
      - targets: ["127.0.0.1:8210"]
  # NMS exposes the same last-good targets it receives from deployment discovery.
  - job_name: netcore-services
    http_sd_configs:
      - url: http://127.0.0.1:8210/api/v1/targets/prometheus
        refresh_interval: 30s
