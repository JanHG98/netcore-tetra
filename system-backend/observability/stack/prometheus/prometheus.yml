    system: netcore-tetra
    # Was: Legt den YAML-Bereich oder Wert `environment` fest.
    # Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
    environment: open-lab
# Was: Legt den YAML-Bereich oder Wert `rule_files` fest.
# Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
rule_files:
  - /etc/prometheus/rules/*.yml
# Was: Legt den YAML-Bereich oder Wert `alerting` fest.
# Warum: Die Einstellung ist ausdrücklich dokumentiert, damit der automatisierte Ablauf reproduzierbar bleibt.
alerting:
