# Was: Setzt die Einstellung `public_base_url` für server.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
public_base_url = "http://127.0.0.1:8230"
# Was: Setzt die Einstellung `max_body_bytes` für server.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_body_bytes = 100663296

