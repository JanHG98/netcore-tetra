# authoritative injects validated 35-byte frames into an existing media session.
# Was: Setzt die Einstellung `operating_mode` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
