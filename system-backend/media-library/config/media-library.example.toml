# Was: Öffnet den Konfigurationsabschnitt `codec`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[codec]
# Was: Setzt die Einstellung `frame_bytes` für codec.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
frame_bytes = 35
# The command is executed directly without a shell. {input} and {output} are
# replaced with paths owned by the service.
# Was: Setzt die Einstellung `ffmpeg_command` für codec.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
ffmpeg_command = [
  "/usr/bin/ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
  "-i", "{input}", "-ac", "1", "-ar", "8000", "-c:a", "pcm_s16le", "{output}"
]
# Optional native helper commands. They must produce/consume packed 35-byte
# TETRA speech service 0 frames. Empty means WAV/MP3 assets remain preview-only,
# while imported .tacelp assets remain directly playable.
# Was: Setzt die Einstellung `encoder_command` für codec.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
encoder_command = []
# Was: Setzt die Einstellung `decoder_command` für codec.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
decoder_command = []

