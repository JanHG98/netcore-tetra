# Was: Setzt die Einstellung `max_total_bytes` für storage.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_total_bytes = 21474836480
# Was: Setzt die Einstellung `fsync_imports` für storage.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
fsync_imports = true

