# Was: Setzt die Einstellung `worker_interval_ms` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
worker_interval_ms = 500
# Was: Setzt die Einstellung `probe_interval_secs` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
probe_interval_secs = 15
# Was: Setzt die Einstellung `import_timeout_secs` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
import_timeout_secs = 120
# Was: Setzt die Einstellung `max_assets` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_assets = 10000
# Was: Setzt die Einstellung `max_jobs` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_jobs = 2000
# Was: Setzt die Einstellung `max_events` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_events = 5000
# Was: Setzt die Einstellung `max_audit_records` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_audit_records = 10000
# Was: Setzt die Einstellung `max_attempts` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
max_attempts = 3
# Was: Setzt die Einstellung `frame_interval_ms` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
frame_interval_ms = 60
# Was: Setzt die Einstellung `auto_approve_tts` für Laufzeit.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
auto_approve_tts = false
# Automatically copy completed basis-station recordings and TTS media to archive_root.
auto_archive_recordings = true
auto_archive_tts = true

# End-to-end radio playout. In basisstation mode the Media Library delegates
# the approved preview WAV to the selected TBS. The TBS downloads the complete
# asset, encodes it with its native TETRA codec, creates the radio call, sends
# the audio and releases the call again.
[playout]
mode = "basisstation"
default_station = "srv-m-tbs-01"
request_timeout_secs = 15
completion_timeout_secs = 900
poll_interval_ms = 500

[[playout.stations]]
id = "srv-m-tbs-01"
name = "SRV-M-TBS-01"
base_url = "http://10.0.1.22:8080"
enabled = true
# username = "admin"
# password = "change-me"

# Was: Öffnet den Konfigurationsabschnitt `codec`.
# Warum: Zusammengehörige Einstellungen bleiben dadurch klar gruppiert und leichter auffindbar.
[codec]
# Was: Setzt die Einstellung `frame_bytes` für codec.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
frame_bytes = 35
# The command is executed directly without a shell. {input} and {output} are
# replaced with paths owned by the service.
# Was: Setzt die Einstellung `ffmpeg_command` für codec.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
ffmpeg_command = [
  "/usr/bin/ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
  "-i", "{input}", "-ac", "1", "-ar", "8000", "-c:a", "pcm_s16le", "{output}"
]
# Optional native helper commands. They must produce/consume packed 35-byte
# TETRA speech service 0 frames. Empty means WAV/MP3 assets remain preview-only,
# while imported .tacelp assets remain directly playable.
# Was: Setzt die Einstellung `encoder_command` für codec.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
encoder_command = []
# Was: Setzt die Einstellung `decoder_command` für codec.
# Warum: Der Wert wird ausdrücklich festgelegt, damit Build oder Dienst nicht von unbekannten Standardannahmen abhängen.
decoder_command = []

###############################################################################
# CENTRAL PIPER TEXT TO SPEECH
###############################################################################
[tts]
enabled = true
endpoint = "http://127.0.0.1:5005"
template_directory = "/var/lib/netcore-media-library/tts/templates"
default_voice = "de-thorsten"
default_speed = 0.95
max_text_characters = 2000
synthesis_timeout_secs = 90
max_output_file_mb = 25

[[tts.voices]]
id = "de-thorsten"
name = "Deutsch – Thorsten (mittel)"
provider_voice = "de_DE-thorsten-medium"

[[tts.voices]]
id = "de-thorsten-high"
name = "Deutsch – Thorsten (hoch)"
provider_voice = "de_DE-thorsten-high"

[[tts.voices]]
id = "de-karlsson"
name = "Deutsch – Karlsson"
provider_voice = "de_DE-karlsson-low"

[[tts.voices]]
id = "de-pavoque"
name = "Deutsch – Pavoque"
provider_voice = "de_DE-pavoque-low"

[[tts.voices]]
id = "de-thorsten-neutral"
name = "Deutsch – Thorsten emotional (neutral)"
provider_voice = "de_DE-thorsten_emotional-medium"
speaker_id = 4

